# =============================================================================
# GFX.INI - GRAPHICS PIPELINE CONFIGURATION
# Target: Allwinner H700 / Mali-G31 MP2 / Panfrost
# Location: /opt/muos/share/emulator/dolphin/Config/GFX.ini
# =============================================================================
#
# CRITICAL WARNING:
#   Backend = Vulkan on Panfrost is EXPERIMENTAL and NON-CONFORMANT.
#   Use OGL. Always. This is not a suggestion. This is physics.
# =============================================================================

[Hardware]
# -----------------------------------------------------------------------------
# BASIC HARDWARE SETTINGS
# -----------------------------------------------------------------------------

# VSync - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Enables vertical synchronisation.
# Effects: True -> syncs to refresh rate (eliminates tearing, adds input
#   lag, causes presentation stalls on Mali). False -> maximum perf.
# Hints: This is the single most common cause of "why is my framerate
#   capped at 30?". The answer is VSync. The solution is False.
VSync = False

# Adapter - Default: 0 | Type: Integer | muOS: IGNORE
# Description: GPU adapter index.
# Effects: Different values -> different GPU. 0 -> first GPU.
# Hints: There's only one GPU. This is decorative.
Adapter = 0


[Settings]
# -----------------------------------------------------------------------------
# RESOLUTION, SHADERS, TEXTURE CACHE
# -----------------------------------------------------------------------------
#
#   FastDepthCalc = True -> sounds like a shortcut. Is actually the MORE
#     accurate method on modern builds.
#   SafeTextureCacheColorSamples = 0 -> does NOT mean "off." It means
#     "maximum accuracy." 0 = Safe, 128 = Fast, 512 = Middle.
#   ShaderCompilationMode = 3 -> Skip Drawing. Skips rendering objects
#     whose shaders aren't ready.
# -----------------------------------------------------------------------------

# Backend - Default: OGL | Type: Text | muOS: REQUIRED
# Description: Graphics backend. OGL=OpenGL, Vulkan=Vulkan, Software=CPU.
# Effects: OGL -> works on Panfrost. Vulkan -> broken on Panfrost.
#   Software -> unusably slow.
# Hints: The only backend that works on Panfrost. Vulkan is experimental
#   and non-conformant. It will not work. Stop trying.
Backend = OGL

# AspectRatio - Default: 0 | Type: Integer | muOS: RECOMMENDED | Recommended: 0
# Description: Aspect ratio. 0=Auto, 1=Force 16:9, 2=Force 4:3, 3=Stretch.
# Effects: 0 -> auto-detect. 1 -> widescreen. 2 -> force 4:3.
#   3 -> stretch to window.
# Hints: The screen is 4:3. Widescreen hack on a 4:3 display is an
#   exercise in futility. Leave it at 0.
AspectRatio = 0

# InternalResolution - Default: 1 | Type: Integer | muOS: RECOMMENDED | Recommended: 1
# Description: Internal resolution multiplier. 1=1x native, 2=2x, 3=3x.
# Effects: 1 -> native (640x480). 2 -> 1280x960. 3 -> 1920x1440.
#   Higher -> more GPU work, no visible benefit on 3.5".
# Hints: The screen is 640x480. Rendering 1280x960 wastes battery and
#   the GPU's thanks. Nobody thanks you.
InternalResolution = 1

# WideScreenHack - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Enables widescreen hack for 4:3 games.
# Effects: True -> forces 16:9 rendering (may cause graphical glitches).
# Hints: The screen is 4:3. Leave it off.
WideScreenHack = False

# DisableFog - Default: True | Type: Boolean | muOS: RECOMMENDED
# Description: Disables fog rendering.
# Effects: True -> fog removed (one less pixel-shader pass).
#   False -> fog rendered.
# Hints: Removes a pixel-shader pass. Occasionally fixes black-screen
#   bugs. Keep it True.
DisableFog = True

# EnablePixelLighting - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Enables per-pixel lighting.
# Effects: True -> per-pixel lighting (more GPU work). False -> per-vertex.
# Hints: GPU cost not worth it on G31. Leave it off.
EnablePixelLighting = False

# FastDepthCalc - Default: True | Type: Boolean | muOS: RECOMMENDED
# Description: Enables fast depth calculation.
# Effects: True -> fast depth (accurate on modern builds).
#   False -> slow depth.
# Hints: Despite the name, it's the more accurate method. Keep True
#   globally. Disable per-game only if a title flickers on Panfrost.
FastDepthCalc = True

# MaxAnisotropy - Default: 0 | Type: Integer (0-4) | muOS: RECOMMENDED | Recommended: 0
# Description: Anisotropic filtering. 0=off, 1=1x, 2=2x, 3=4x, 4=8x.
# Effects: Higher -> sharper textures at angles, more GPU work.
# Hints: Free on desktop, expensive on G31. Leave it at 0.
MaxAnisotropy = 0

# ForceFiltering - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Forces texture filtering.
# Effects: True -> forced filtering (more GPU work). False -> no force.
# Hints: GPU cost, minimal visual benefit on 3.5". Leave it off.
ForceFiltering = False

# SafeTextureCacheColorSamples - Default: 0 | Type: Integer | muOS: RECOMMENDED | Recommended: 0
# Description: Texture cache accuracy: 0=Safe, 128=Fast, 512=Middle.
# Effects: 0 -> maximum accuracy, slowest. 128 -> fast, least accurate.
#   512 -> middle ground.
# Hints: 0 is "Safe", not "off". Only raise to 512 per-game for choppy
#   FMVs. Not a global setting.
SafeTextureCacheColorSamples = 0

# ShowFPS - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Shows FPS counter.
# Effects: True -> FPS overlay. False -> no overlay.
# Hints: Overlay eats GPU cycles. Leave it off.
ShowFPS = False

# HiresTextures - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Enables HD texture packs.
# Effects: True -> HD textures loaded (massive RAM usage).
# Hints: On 1 GB RAM, HD textures are a memory apocalypse. Keep off.
HiresTextures = False

# CacheHiresTextures - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Caches HD textures for faster loading.
# Effects: True -> cached (more RAM). False -> no cache.
# Hints: HD textures on 1 GB RAM = OOM crash. Keep off.
CacheHiresTextures = False

# MSAA - Default: 1 | Type: Integer (1-8) | muOS: RECOMMENDED | Recommended: 1
# Description: MSAA level: 1=off, 2=2x, 4=4x, 8=8x.
# Effects: Higher -> smoother edges, much more GPU work.
# Hints: MSAA on G31 MP2 is a GPU cycle incinerator. Leave it at 1.
MSAA = 1

# SSAA - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Enables Super Sampling Anti-Aliasing.
# Effects: True -> SSAA (massive GPU cost). False -> no SSAA.
# Hints: Same as MSAA, worse. Leave it off.
SSAA = False

# ShaderCompilationMode - Default: 3 | Type: Integer | muOS: RECOMMENDED | Recommended: 3
# Description: Shader compilation. 0=Sync, 1=Async, 2=Hybrid,
#   3=Skip Drawing.
# Effects: 0 -> sync (stutter). 1 -> async. 2 -> hybrid. 3 -> skip
#   drawing (skips objects whose shaders aren't ready, brief pop-in).
# Hints: The correct choice on Mali. Brief pop-in beats eternal stutter.
ShaderCompilationMode = 3

# WaitForShadersBeforeStarting - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Waits for shaders before starting emulation.
# Effects: True -> waits (longer boot). False -> starts immediately.
# Hints: Unnecessary with Skip Drawing already handling stutter.
WaitForShadersBeforeStarting = False


[Enhancements]
# -----------------------------------------------------------------------------
# THE SHINY BOX (MOSTLY DETRIMENTS ON THIS HARDWARE)
# -----------------------------------------------------------------------------

# ArbitraryMipmapDetection - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Enables arbitrary mipmap detection.
# Effects: True -> detects mipmaps (more GPU work). False -> standard.
# Hints: GPU cost, minimal benefit on a 3.5" screen. Leave it off.
ArbitraryMipmapDetection = False

# ForceTrueColor - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Forces 24-bit colour.
# Effects: True -> 24-bit colour (more GPU work). False -> standard.
# Hints: GPU cost. Leave it off.
ForceTrueColor = False

# DisableCopyFilter - Default: True | Type: Boolean | muOS: RECOMMENDED
# Description: Disables the GameCube copy filter.
# Effects: True -> copy filter disabled (slightly cleaner image, one
#   less GPU pass). False -> copy filter enabled.
# Hints: Slightly cleaner image, one less GPU pass. Keep True.
DisableCopyFilter = True

# PostProcessingShader - Default: (empty) | Type: Text | muOS: RECOMMENDED
# Description: Path to a post-processing shader.
# Effects: Non-empty -> shader loaded (bloom, CRT, etc.).
#   Empty -> no shader.
# Hints: You don't have GPU cycles for post-processing. Leave it empty.
PostProcessingShader = 


[Hacks]
# -----------------------------------------------------------------------------
# THE PERFORMANCE BAZAAR
# -----------------------------------------------------------------------------
#
#   EFBAccessEnable = False -> the biggest single win in this section.
#     Skips CPU EFB reads. Breaks games that use EFB for gameplay.
#   VISkip = True -> fine for 95% of games. BUT on Wind Waker and
#     Twilight Princess, it stops rendering ENTIRELY.
#   BBoxEnable = False -> needed by ~10 games.
# -----------------------------------------------------------------------------

# NoMipmapping - Default: True | Type: Boolean | muOS: RECOMMENDED
# Description: Disables mipmap generation.
# Effects: True -> no mipmaps (saves GPU cycles). False -> generated.
# Hints: Saves GPU cycles. Minor visual impact. Keep True.
NoMipmapping = True

# EFBToTextureEnable - Default: True | Type: Boolean | muOS: RECOMMENDED
# Description: Stores EFB copies as GPU textures instead of system RAM.
# Effects: True -> EFB copies on GPU (fast). False -> copies to RAM.
# Hints: Eliminates CPU readback. Always on.
EFBToTextureEnable = True

# EFBScaledCopy - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Scales EFB copies to match internal resolution.
# Effects: True -> scaled copies (more GPU work). False -> native scale.
# Hints: Consistent with native resolution. No mismatch, no wasted work.
EFBScaledCopy = False

# EFBEmulateFormatChanges - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Emulates EFB format changes.
# Effects: True -> format changes emulated (accurate, slower).
#   False -> not emulated (faster, may break some titles).
# Hints: Breaks a handful of titles (some Kirby/Zelda). Keep False
#   globally. Enable per-game if needed.
EFBEmulateFormatChanges = False

# EFBAccessEnable - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Enables CPU access to the EFB (Embedded Frame Buffer).
# Effects: True -> CPU can read EFB (accurate, slow).
#   False -> CPU cannot read EFB (fast, breaks games that need it).
# Hints: The biggest single performance win in this section. Enable
#   per-game only for titles that need it.
EFBAccessEnable = False

# DeferEFBCopies - Default: True | Type: Boolean | muOS: RECOMMENDED
# Description: Makes EFB copies asynchronous.
# Effects: True -> async copies (faster). False -> synchronous (slower).
# Hints: Free performance. Disabling it drops your framerate ~10%.
DeferEFBCopies = True

# EnableGPUTextureDecoding - Default: True | Type: Boolean | muOS: RECOMMENDED
# Description: Offloads texture decoding to the GPU.
# Effects: True -> GPU decodes (frees CPU). False -> CPU decodes.
# Hints: Frees CPU cycles. A/B test per-game on GPU-bound titles.
EnableGPUTextureDecoding = True

# XFBToTextureEnable - Default: True | Type: Boolean | muOS: RECOMMENDED
# Description: Stores XFB (External Frame Buffer) as GPU textures.
# Effects: True -> XFB on GPU (fast). False -> XFB to RAM (slow).
# Hints: Eliminates CPU readback for display output. Always on.
XFBToTextureEnable = True

# ImmediateXFBEnable - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Uses immediate XFB presentation.
# Effects: True -> immediate presentation (lower latency). False -> deferred.
# Hints: On muOS, True is the better choice. Desktop guides say False;
#   they have a different presentation pipeline.
ImmediateXFBEnable = False

# FastTextureSampling - Default: True | Type: Boolean | muOS: RECOMMENDED
# Description: Uses fast texture sampling path.
# Effects: True -> fast sampling (less GPU work). False -> accurate.
# Hints: Safe for the vast majority of titles. Keep True.
FastTextureSampling = True

# BBoxEnable - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Enables bounding box emulation.
# Effects: True -> bounding box emulated (accurate, expensive).
# Hints: Only needed by a handful of games. Enabling globally is like
#   buying a forklift because you might one day move a piano.
BBoxEnable = False

# VertexRounding - Default: True | Type: Boolean | muOS: RECOMMENDED
# Description: Rounds vertex positions.
# Effects: True -> vertices rounded (prevents wobble). False -> no rounding.
# Hints: Prevents vertex wobble. Harmless to leave on. Keep True.
VertexRounding = True

# SkipDuplicateXFBs - Default: True | Type: Boolean | muOS: RECOMMENDED
# Description: Skips identical XFB frames.
# Effects: True -> duplicate frames skipped (faster). False -> all presented.
# Hints: Free performance. Always on.
SkipDuplicateXFBs = True

# VISkip - Default: True | Type: Boolean | muOS: RECOMMENDED
# Description: Skips VI (Video Interface) frames when possible.
# Effects: True -> VI frames skipped (faster). False -> all frames rendered.
# Hints: Fine for 95% of games. BUT on Wind Waker and Twilight Princess
#   it stops rendering ENTIRELY. Disable per-game for those two titles.
VISkip = True
