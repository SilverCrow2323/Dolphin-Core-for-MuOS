# =============================================================================
# DOLPHIN.INI - GLOBAL CORE CONFIGURATION
# Target: Allwinner H700 on muOS
# Location: /opt/muos/share/emulator/dolphin/Config/Dolphin.ini
# =============================================================================

[General]
# -----------------------------------------------------------------------------
# PATHS, MEMORY CARDS, MISC
# -----------------------------------------------------------------------------

# ShowLag - Default: False | Type: Boolean | muOS: IGNORE
# Description: Displays input lag information in the OSD.
# Effects: True -> shows lag metrics. False -> hidden.
# Hints: You're on a handheld. There is no keyboard to debug with.
#   Leave it False.
ShowLag = False

# ShowFrameCount - Default: False | Type: Boolean | muOS: IGNORE
# Description: Shows the current frame count in the OSD.
# Effects: True -> frame count overlay. False -> no overlay.
# Hints: If you need to count frames, you're doing TAS work. You're not.
#   Leave it False.
ShowFrameCount = False

# ShowActiveTitle - Default: False | Type: Boolean | muOS: IGNORE
# Description: Shows the active game title in the window title bar.
# Effects: True -> title bar updates. False -> static.
# Hints: muOS runs fullscreen. There is no title bar. Decorative.
ShowActiveTitle = False

# ShowNetPlayPing - Default: False | Type: Boolean | muOS: IGNORE
# Description: Shows NetPlay ping information.
# Effects: True -> ping display. False -> hidden.
# Hints: NetPlay on H700 is a slideshow. Ignore it entirely.
ShowNetPlayPing = False

# HideCursor - Default: True | Type: Boolean | muOS: RECOMMENDED
# Description: Hides the mouse cursor during emulation.
# Effects: True -> cursor hidden. False -> cursor visible.
# Hints: On a handheld with no mouse, a visible cursor is a bug.
HideCursor = True

# ShowMouseCursor - Default: False | Type: Boolean | muOS: IGNORE
# Description: Shows the mouse cursor when the window is not focused.
# Effects: True -> cursor shown. False -> hidden.
# Hints: There is no mouse. There is no focus. Ghost setting.
ShowMouseCursor = False

# ISOPaths - Default: 0 | Type: Integer | muOS: IGNORE
# Description: Number of registered ISO search paths.
# Effects: N > 0 -> Dolphin scans that many paths. 0 -> no paths.
# Hints: muOS passes the ROM path directly. Leave at 0.
ISOPaths = 0

# RecursiveISOPaths - Default: False | Type: Boolean | muOS: IGNORE
# Description: Whether to scan subdirectories in ISO paths.
# Effects: True -> recursive scan. False -> top-level only.
# Hints: See ISOPaths. Same joke, different punchline.
RecursiveISOPaths = False

# GCMPathes - Default: 0 | Type: Integer | muOS: IGNORE
# Description: Number of GameCube memory card paths.
# Effects: N > 0 -> Dolphin scans that many paths. 0 -> no paths.
# Hints: muOS uses SlotA_GC / SlotB_GC instead. Redundant.
GCMPathes = 0

# RecursiveGCMPaths - Default: False | Type: Boolean | muOS: IGNORE
# Description: Recursive scan for GCM files.
# Effects: True -> recursive. False -> top-level only.
# Hints: See GCMPathes. The redundancy is impressive.
RecursiveGCMPaths = False

# NANDRootPath - Default: Wii | Type: Folder path | muOS: CRITICAL
# Description: Path to the emulated Wii NAND filesystem.
# Effects: Correct path -> Wii games boot. Wrong path -> Wii Menu not found.
# Hints: Change this and Wii games won't boot. Don't change it.
NANDRootPath = Wii

# WiiSDCardPath - Default: Wii/sd.raw | Type: Folder path | muOS: RECOMMENDED
# Description: Path to the emulated Wii SD card image.
# Effects: Correct path -> SD functionality. Wrong path -> no SD card.
# Hints: Leave default. Unless you enjoy recreating virtual SD cards.
WiiSDCardPath = Wii/sd.raw

# LoadPath - Default: Load | Type: Folder path | muOS: RECOMMENDED
# Description: Directory for save states and game loads.
# Effects: Correct path -> state saves work. Wrong path -> states lost.
# Hints: muOS manages state paths via its own launcher. Leave it alone.
LoadPath = Load

# DumpPath - Default: Dump | Type: Folder path | muOS: IGNORE
# Description: Directory for texture/frame/audio dumps.
# Effects: Correct path -> dumps saved. Wrong path -> dumps lost.
# Hints: You're not dumping anything on a 1 GB RAM budget. Ignore.
DumpPath = Dump

# ResourcePackPath - Default: ResourcePacks | Type: Folder path | muOS: IGNORE
# Description: Directory for custom resource packs.
# Effects: Correct path -> packs loaded. Wrong path -> packs missing.
# Hints: muOS has its own GraphicMods/ and Textures/. Redundant.
ResourcePackPath = ResourcePacks

# WirelessMac - Default: 00:17:ab:a3:1f:27 | Type: Text (MAC address) | muOS: IGNORE
# Description: Emulated Wii wireless MAC address.
# Effects: Different MAC -> different network identity.
# Hints: Changing this won't fix NetPlay latency on a handheld.
WirelessMac = 00:17:ab:a3:1f:27

# UseDualCore - Default: True | Type: Boolean | muOS: REQUIRED
# Description: Enables dual-core mode (separate CPU/GPU threads).
# Effects: True -> separate threads. False -> single-threaded slog.
# Hints: Non-negotiable on H700. Turning this off is driving in first gear.
UseDualCore = True

# EnableCheats - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Master switch for Action Replay / Gecko codes.
# Effects: True -> cheats can be loaded. False -> cheats ignored.
# Hints: Turn on only if you actually use cheats.
EnableCheats = False

# JITFollowBranch - Default: True | Type: Boolean | muOS: RECOMMENDED
# Description: JIT optimisation for branch-following.
# Effects: True -> faster branch handling. False -> slower.
# Hints: Free performance. No reason to touch. Leave it alone.
JITFollowBranch = True

# AudioBackend - Default: ALSA | Type: Text | muOS: REQUIRED
# Description: Audio backend selection.
# Effects: ALSA -> low latency. Other backends -> latency or silence.
# Hints: The only backend that doesn't introduce 200ms latency on muOS.
AudioBackend = ALSA

# AudioLatency - Default: 3 | Type: Integer (ms) | muOS: RECOMMENDED | Recommended: 3
# Description: Audio buffer latency in milliseconds.
# Effects: Lower -> less lag, risk of crackle. Higher -> more lag.
# Hints: Below 2ms is for people who enjoy audio crackling. Choose wisely.
AudioLatency = 3

# AudioStretch - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Time-stretches audio to match emulation speed.
# Effects: True -> pitch preserved during slowdowns. False -> pitch changes.
# Hints: On H700, audio stretch eats CPU cycles you don't have. Leave off.
AudioStretch = False

# SoundVolume - Default: 100 | Type: Integer (0-100) | muOS: PERSONAL
# Description: Master volume.
# Effects: 0 -> silence. 100 -> maximum.
# Hints: Set to whatever your ears tolerate. It's your ears.
SoundVolume = 100

# FastDiscSpeed - Default: True | Type: Boolean | muOS: RECOMMENDED
# Description: Bypasses emulated DVD drive latency.
# Effects: True -> fast disc reads. False -> emulated slow reads.
# Hints: Free speed boost for disc-based titles. Leave it on.
FastDiscSpeed = True

# DriveSpeed - Default: 0 | Type: Integer | muOS: IGNORE
# Description: Emulated drive speed. 0 = default.
# Effects: Different values -> different read speeds.
# Hints: FastDiscSpeed handles this. You don't need to.
DriveSpeed = 0

# WiiKeyboard - Default: False | Type: Boolean | muOS: IGNORE
# Description: Enables USB keyboard emulation for Wii.
# Effects: True -> keyboard emulated. False -> not.
# Hints: Unless you're playing a game that needs it, ignore.
WiiKeyboard = False

# WiiSensorBarPosition - Default: 2 | Type: Integer (0-4) | muOS: IGNORE
# Description: Emulated sensor bar position.
# Effects: Different positions -> different IR pointer behaviour.
# Hints: IR pointer emulation is broken on muOS anyway. Ignore.
WiiSensorBarPosition = 2

# WiiSensorBarSensitivity - Default: 3 | Type: Integer (0-4) | muOS: IGNORE
# Description: Sensor bar sensitivity.
# Effects: Higher -> more sensitive. Lower -> less.
# Hints: See above. IR is broken. This setting is a ghost.
WiiSensorBarSensitivity = 3

# WiiSpeakerPan - Default: 0 | Type: Integer | muOS: IGNORE
# Description: Wii Remote speaker panning.
# Effects: Different values -> different panning. 0 -> centre.
# Hints: The H700 doesn't have a Wii Remote speaker.
WiiSpeakerPan = 0

# HotkeysRequireFocus - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Whether hotkeys require window focus.
# Effects: True -> only work when focused. False -> always work.
# Hints: On muOS, Dolphin runs fullscreen. Leave it False.
HotkeysRequireFocus = False

# EnableNetworkLogging - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Enables network traffic logging.
# Effects: True -> logs written. False -> no logs.
# Hints: Unless you enjoy 50 MB log files for no reason, leave off.
EnableNetworkLogging = False

# MemoryCardA - Default: True | Type: Boolean | muOS: RECOMMENDED
# Description: Enables memory card in Slot A.
# Effects: True -> saves work. False -> no saves.
# Hints: Keep True. Otherwise you can't save GameCube games.
MemoryCardA = True

# MemoryCardB - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Enables memory card in Slot B.
# Effects: True -> second card active. False -> not.
# Hints: Leave False unless a game specifically needs it.
MemoryCardB = False

# SlotA_GC - Default: MemoryCardA.USA.raw | Type: Text | muOS: RECOMMENDED
# Description: Memory card A filename.
# Effects: Different name -> different file.
# Hints: Leave default. muOS may override this.
SlotA_GC = MemoryCardA.USA.raw

# SlotB_GC - Default: MemoryCardB.USA.raw | Type: Text | muOS: RECOMMENDED
# Description: Memory card B filename.
# Effects: Different name -> different file.
# Hints: Leave default. See SlotA_GC.
SlotB_GC = MemoryCardB.USA.raw

# FullscreenDisplayRes - Default: Auto | Type: Text | muOS: RECOMMENDED
# Description: Fullscreen resolution selection.
# Effects: Auto -> detects. Specific -> forced.
# Hints: On muOS, the framebuffer is already configured. Leave Auto.
FullscreenDisplayRes = Auto

# AutoDiscChange - Default: True | Type: Boolean | muOS: RECOMMENDED
# Description: Automatically switches discs when prompted.
# Effects: True -> auto-switch. False -> manual switch.
# Hints: Keep True. Unless you enjoy swapping ISOs mid-game.
AutoDiscChange = True

# USBGeckoEnabled - Default: False | Type: Boolean | muOS: IGNORE
# Description: Enables USB Gecko debugging.
# Effects: True -> debugging enabled. False -> not.
# Hints: You're not debugging Dolphin on a handheld. Ignore.
USBGeckoEnabled = False

# EmulateDiscSpeed - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Emulates disc drive speed limitations.
# Effects: True -> slow reads. False -> fast reads.
# Hints: You want fast disc reads. Keep it False.
EmulateDiscSpeed = False


[Interface]
# -----------------------------------------------------------------------------
# GUI BEHAVIOUR
# -----------------------------------------------------------------------------

# ConfirmStop - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Asks for confirmation when stopping emulation.
# Effects: True -> confirmation dialog. False -> instant stop.
# Hints: On muOS you want instant exit, not a dialog box.
ConfirmStop = False

# UsePanicHandlers - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Shows panic error dialogs on crashes.
# Effects: True -> panic dialogs. False -> silent crash.
# Hints: A panic handler on a 3.5" screen is nobody can read.
UsePanicHandlers = False

# OnScreenDisplayMessages - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Enables OSD messages (e.g., "Save State Loaded").
# Effects: True -> OSD shown. False -> hidden.
# Hints: OSD messages on a handheld eat precious screen real estate.
OnScreenDisplayMessages = False

# OSDMessageDuration - Default: 2.5 | Type: Float (seconds) | muOS: IGNORE
# Description: How long OSD messages stay on screen.
# Effects: Higher -> longer. Lower -> shorter.
# Hints: Ignore if OSD is disabled. Which it should be.
OSDMessageDuration = 2.5

# ThemeName - Default: Clean | Type: Text | muOS: IGNORE
# Description: GUI theme name.
# Effects: Different themes -> different GUI colours.
# Hints: muOS uses its own frontend. Dolphin's GUI is invisible.
ThemeName = Clean

# DebugModeEnabled - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Enables debug UI panels.
# Effects: True -> debug panels shown. False -> hidden.
# Hints: Debug mode on a handheld is a racecar with the hood open.
DebugModeEnabled = False

# ShowDebuggingUI - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Shows additional debug windows.
# Effects: True -> more debug windows. False -> none.
# Hints: See above. The answer is still no.
ShowDebuggingUI = False

# PauseOnFocusLost - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Pauses emulation when window loses focus.
# Effects: True -> pause on focus loss. False -> continue.
# Hints: On muOS, Dolphin never loses focus. You can't alt-tab.
PauseOnFocusLost = False

# ExtendedFPSInfo - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Shows additional FPS metrics.
# Effects: True -> extra overlay text. False -> no overlay.
# Hints: Extra overlay text costs GPU cycles you don't have. Leave off.
ExtendedFPSInfo = False

# UseBuiltinTitleDatabase - Default: True | Type: Boolean | muOS: RECOMMENDED
# Description: Uses Dolphin's internal game title database.
# Effects: True -> titles shown correctly. False -> titles missing.
# Hints: Harmless and improves game list readability. Leave True.
UseBuiltinTitleDatabase = True


[Core]
# -----------------------------------------------------------------------------
# THE ENGINE ROOM
# -----------------------------------------------------------------------------

# CPUCore - Default: 4 | Type: Integer | muOS: REQUIRED | Recommended: 4
# Description: CPU emulation engine. 0=Interpreter, 1=JIT x64,
#   2=JITIL, 4=JIT ARM64, 5=Cached Interpreter.
# Effects: 4 -> JIT ARM64 (fast). 0 -> Interpreter (10-50x slower).
# Hints: This is JITARM64. The only option. Setting it to 0 is a war
#   crime against your own free time.
CPUCore = 4

# CPUThread - Default: True | Type: Boolean | muOS: REQUIRED
# Description: Enables dual-core mode (separate CPU/GPU threads).
# Effects: True -> CPU and GPU on separate threads. False -> single thread.
# Hints: Non-negotiable. The H700 has 4 cores. Use them.
CPUThread = True

# DSPHLE - Default: True | Type: Boolean | muOS: REQUIRED
# Description: Uses HLE audio emulation (fast) instead of LLE (accurate).
# Effects: True -> HLE audio. False -> LLE audio (cycle-accurate, slow).
# Hints: LLE audio on A53 is a CPU cycle bonfire. Keep HLE.
DSPHLE = True

# EnableIdleSkipping - Default: True | Type: Boolean | muOS: RECOMMENDED
# Description: Skips CPU busy-wait loops.
# Effects: True -> idle loops skipped. False -> loops executed.
# Hints: Free performance. No downside. Always on.
EnableIdleSkipping = True

# OverclockEnable - Default: True | Type: Boolean | muOS: RECOMMENDED
# Description: Enables CPU clock override.
# Effects: True -> Overclock value used. False -> native clock.
# Hints: You'll want per-game underclocks. Set True.
OverclockEnable = True

# Overclock - Default: 0.70 | Type: Float (0.10-2.00) | muOS: RECOMMENDED | Recommended: 0.70
# Description: Emulated CPU clock multiplier.
# Effects: 1.0 -> 100% clock (native). 0.70 -> 70% clock (30% less work).
#   Below 0.60 -> risk of game freezes. Above 1.00 -> overclocking.
# Hints: 0.70 is the magic number. Below 0.60 you get freezes. Welcome
#   to the eternal trade-off.
Overclock = 0.70

# MMU - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Enables Memory Management Unit emulation.
# Effects: True -> accurate memory management (10-20% overhead).
#   False -> fastmem path.
# Hints: Global MMU is the single most common performance mistake.
#   Enable per-game only for the ~32 titles that need it.
MMU = False

# EnableMMU - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Alias for MMU on some builds.
# Effects: Same as MMU.
# Hints: Same as MMU. Don't enable globally.
EnableMMU = False

# SyncGPU - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Synchronises GPU thread with CPU thread.
# Effects: True -> GPU syncs with CPU (accurate, slower). False -> async.
# Hints: Keep False in performance profiles. True only if you see
#   rendering desyncs, and only per-game.
SyncGPU = False

# SyncOnSkipIdle - Default: True | Type: Boolean | muOS: RECOMMENDED
# Description: Synchronises GPU when idle is skipped.
# Effects: True -> sync on idle skip. False -> no sync.
# Hints: Prevents timing issues with idle skipping. Leave it True.
SyncOnSkipIdle = True

# Framelimit - Default: 1 | Type: Integer | muOS: RECOMMENDED | Recommended: 1
# Description: Frame limit: 0=unlimited, 1=auto, N=N FPS.
# Effects: 0 -> no limit. 1 -> auto (matches the game's native rate).
#   N -> fixed N FPS.
# Hints: Auto matches the game's native framerate. Unlimited is a
#   slideshow on H700. Leave it at 1.
Framelimit = 1

# FPRF - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Enables Floating-Point Result Flag emulation.
# Effects: True -> accurate FPRF. False -> faster.
# Hints: Only needed by a handful of games. Expensive. Leave off.
FPRF = False

# Fastmem - Default: True | Type: Boolean | muOS: RECOMMENDED
# Description: Enables fast memory access via host virtual memory.
# Effects: True -> direct memory access (10x faster).
#   False -> translated access.
# Hints: Free performance. If you disable it, everything is 15% slower.
Fastmem = True

# TimingVariance - Default: 40 | Type: Integer | muOS: RECOMMENDED | Recommended: 40
# Description: Audio buffer timing slack (higher = more forgiving).
# Effects: Lower -> tighter sync, risk of crackle.
#   Higher -> more forgiveness, less crackle. Range: 10-100.
# Hints: Your audio crackle dial. If audio pops, raise it. If audio
#   lags, lower it.
TimingVariance = 40

# AccurateNaNs - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Enables accurate NaN handling for floating-point ops.
# Effects: True -> accurate (slower). False -> fast (inaccurate).
# Hints: Expensive. Only needed by edge-case titles. Leave off.
AccurateNaNs = False

# EmulationSpeed - Default: 1.0 | Type: Float | muOS: RECOMMENDED
# Description: Emulation speed multiplier.
# Effects: 1.0 -> normal. 0.5 -> half speed. 2.0 -> double speed.
# Hints: Keep 1.0. Unless you enjoy chipmunk audio.
EmulationSpeed = 1.0

# SkipIPL - Default: True | Type: Boolean | muOS: RECOMMENDED
# Description: Skips GameCube boot animation (IPL).
# Effects: True -> boots directly to game. False -> shows boot animation.
# Hints: Why watch a boot animation when you can play? Leave it True.
SkipIPL = True

# SelectedLanguage - Default: 0 | Type: Integer | muOS: IGNORE
# Description: GameCube IPL language.
# Effects: Different values -> different language. 0 -> English.
# Hints: SkipIPL makes this irrelevant. Ignore.
SelectedLanguage = 0

# OverrideRegionSettings - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Overrides region-specific settings.
# Effects: True -> overrides. False -> uses defaults.
# Hints: Keep False. Unless you have a specific need.
OverrideRegionSettings = False

# DPL2Decoder - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Enables Dolby Pro Logic II decoding.
# Effects: True -> DPL2 decoding (more CPU). False -> stereo.
# Hints: You're on a handheld with stereo speakers. Keep it off.
DPL2Decoder = False

# EnableCustomRTC - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Enables custom real-time clock.
# Effects: True -> custom RTC used. False -> system clock.
# Hints: Keep False. Unless you're time-travelling.
EnableCustomRTC = False

# CustomRTCValue - Default: 0x386d4380 | Type: Hex | muOS: IGNORE
# Description: Custom RTC value.
# Effects: Different values -> different time.
# Hints: Ignore if custom RTC is disabled. Which it should be.
CustomRTCValue = 0x386d4380


[DSP]
# -----------------------------------------------------------------------------
# AUDIO PROCESSING
# -----------------------------------------------------------------------------

# EnableJIT - Default: True | Type: Boolean | muOS: RECOMMENDED
# Description: Enables JIT compilation for DSP code.
# Effects: True -> JIT-compiled audio (fast). False -> interpreted (slow).
# Hints: Free performance for audio. Leave it on.
EnableJIT = True

# Backend - Default: ALSA | Type: Text | muOS: REQUIRED
# Description: Audio backend.
# Effects: ALSA -> low latency. Other backends -> latency or silence.
# Hints: Pick your poison. ALSA is the least poisonous.
Backend = ALSA

# Volume - Default: 100 | Type: Integer (0-100) | muOS: PERSONAL
# Description: Audio volume.
# Effects: 0 -> silence. 100 -> maximum.
# Hints: Personal preference. The one setting you can't get wrong.
Volume = 100

# DSPThread - Default: True | Type: Boolean | muOS: RECOMMENDED
# Description: Runs DSP on a separate thread.
# Effects: True -> audio on its own thread (faster). False -> main thread.
# Hints: Free performance. Disabling it is like hiring a chef to also
#   wash dishes.
DSPThread = True


[Network]
# -----------------------------------------------------------------------------
# NETPLAY
# -----------------------------------------------------------------------------

# Enable - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Enables network features.
# Effects: True -> NetPlay active. False -> offline.
# Hints: NetPlay on H700 is a slideshow. Don't.
Enable = False

# EnableNetworkLogging - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Enables network logging.
# Effects: True -> logs written. False -> no logs.
# Hints: See above. Ignore.
EnableNetworkLogging = False

# AdoptPAL60 - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: PAL60 mode for network play.
# Effects: True -> PAL60. False -> standard.
# Hints: Irrelevant. Ignore.
AdoptPAL60 = False
