# =============================================================================
# GAMESETTINGS - PER-GAME OVERRIDE REFERENCE
# File name: <GAMEID>.ini
# Location: /opt/muos/share/emulator/dolphin/GameSettings/
# =============================================================================
#
# THE NAMESPACING TRAP - READ THIS OR SUFFER:
#   GameSettings use namespaced sections. If you write [Hacks] instead of
#   [Video_Hacks], Dolphin will SILENTLY IGNORE the entire section.
#
#   CORRECT MAPPING:
#     [Core] [DSP] [Interface]  -> bare names
#     [Settings]     -> [Video_Settings]
#     [Enhancements] -> [Video_Enhancements]
#     [Hacks]        -> [Video_Hacks]
#     [Hardware]     -> [Video_Hardware]
# =============================================================================


[Video_Hacks]
# -----------------------------------------------------------------------------
# GRAPHICS HACK OVERRIDES
# -----------------------------------------------------------------------------

# VISkip - Default: True | Type: Boolean | muOS: REQUIRED | Recommended: False
# Description: Skips VI (Video Interface) frames when possible.
# Effects: True -> VI frames skipped. False -> all frames rendered.
# Hints: NEVER enable on Wind Waker or Twilight Princess. With VISkip =
#   True, these games stop rendering entirely. Black screen. Not slow.
#   Not glitchy. Black. Screen.
VISkip = False

# EFBAccessEnable - Default: False | Type: Boolean | muOS: RECOMMENDED | Recommended: True
# Description: Enables CPU access to the EFB.
# Effects: True -> CPU can read EFB (accurate, slow). False -> CPU
#   cannot read EFB (fast, breaks games that need it).
# Hints: The go-to fix for black-screen bugs. Expensive. Enable
#   per-game, not globally. If a game black-screens, try this first.
EFBAccessEnable = True

# BBoxEnable - Default: False | Type: Boolean | muOS: RECOMMENDED | Recommended: True
# Description: Enables bounding box emulation.
# Effects: True -> bounding box emulated (accurate, expensive).
# Hints: Only needed by a handful of games. Expensive. Enable per-game.
BBoxEnable = True


[Core]
# -----------------------------------------------------------------------------
# CPU OVERRIDES
# -----------------------------------------------------------------------------

# OverclockEnable - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Enables CPU clock override for this game.
# Effects: True -> Overclock value used. False -> native clock.
# Hints: Set True for underclocked games. This game benefits from a
#   targeted underclock.
OverclockEnable = True

# Overclock - Default: 1.0 | Type: Float (0.10-2.00) | muOS: RECOMMENDED | Recommended: 0.70
# Description: Emulated CPU clock multiplier for this game.
# Effects: 1.0 -> 100% clock. 0.70 -> 70% clock (30% less work).
# Hints: 0.70 is the magic number for many CPU-bound titles. Test
#   per-game: it also causes timing desyncs in some titles.
Overclock = 0.70

# MMU - Default: False | Type: Boolean | muOS: RECOMMENDED
# Description: Enables Memory Management Unit emulation.
# Effects: True -> accurate memory management (10-20% overhead).
#   False -> fastmem path.
# Hints: Enable per-game for Skies of Arcadia Legends and ~31 others.
#   Never enable MMU globally. Trust the Dolphin database.
MMU = False


[Video_Settings]
# -----------------------------------------------------------------------------
# GRAPHICS SETTINGS OVERRIDES
# -----------------------------------------------------------------------------

# SafeTextureCacheColorSamples - Default: 0 | Type: Integer | muOS: RECOMMENDED | Recommended: 512
# Description: Texture cache accuracy: 0=Safe, 128=Fast, 512=Middle.
# Effects: 0 -> maximum accuracy. 512 -> middle ground (slower, fixes
#   FMV rendering). 128 -> fast (least accurate).
# Hints: A per-game fix for choppy FMVs. Not a global setting. Not a
#   performance setting. A "this specific game's FMVs look terrible"
#   setting. Use it surgically.
SafeTextureCacheColorSamples = 512

# FastDepthCalc - Default: True | Type: Boolean | muOS: RECOMMENDED | Recommended: False
# Description: Enables fast depth calculation.
# Effects: True -> fast depth (accurate on modern builds). False -> slow.
# Hints: On Panfrost, FastDepthCalc = True can cause flicker. Per-game
#   fix for specific titles.
FastDepthCalc = False
