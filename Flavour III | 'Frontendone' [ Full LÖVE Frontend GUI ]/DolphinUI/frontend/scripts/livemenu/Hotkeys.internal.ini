# DolphinUI — internal Hotkeys.ini
# Keyboard-based bindings so the Live Menu can inject them via uinput.
# Device = SDL/0/Keyboard Mouse is Dolphin's Linux default for SDL2.
# If your build doesn't recognise this device string, change it via
# Dolphin's GUI (Options → Hotkey Settings → Device dropdown) once,
# then this file will keep working.
[Hotkeys1]
Device = SDL/0/Keyboard Mouse
Keys/Save State Slot 1 = `Shift` + `F1`
Keys/Save State Slot 2 = `Shift` + `F2`
Keys/Save State Slot 3 = `Shift` + `F3`
Keys/Load State Slot 1 = `F1`
Keys/Load State Slot 2 = `F2`
Keys/Load State Slot 3 = `F3`
Keys/Reset = `Shift` + `F5`
Keys/Toggle Pause = `F10`
Keys/Toggle FPS = `F6`
Keys/Toggle Speed = `F7`
Keys/Toggle Frame Count = `F8`
Keys/Toggle Input Display = `F9`
Keys/Exit = `Escape`
Keys/Take Screenshot = `F12`
