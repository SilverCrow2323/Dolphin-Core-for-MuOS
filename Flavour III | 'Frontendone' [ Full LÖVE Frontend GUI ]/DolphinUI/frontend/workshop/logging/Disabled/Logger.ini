# Erano [Log]/[Debug] con chiavi mai esistite in Dolphin (Default=Info,
# Enable=True...). Il vero Logger.ini di Dolphin usa [Logs] (booleani per
# sottosistema) + [Options] (Verbosity/WriteToFile/WriteToConsole).
# "Logging disattivato" nella pratica = non scrivere niente su disco.
[Options]
WriteToFile = False
WriteToConsole = False
