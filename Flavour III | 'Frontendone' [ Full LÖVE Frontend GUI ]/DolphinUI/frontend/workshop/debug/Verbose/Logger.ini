# "Debug attivato": livello massimo (5) + sottosistemi extra utili per
# capire problemi di emulazione (JIT, PowerPC, DSP). Voce SEPARATA da
# Logging: quella scrive un log leggibile, questa e' per chi deve
# davvero scavare in un bug.
[Options]
Verbosity = 5
WriteToFile = True
[Logs]
JIT = True
MASTER = True
PowerPC = True
DSP = True
DSPHLE = True
