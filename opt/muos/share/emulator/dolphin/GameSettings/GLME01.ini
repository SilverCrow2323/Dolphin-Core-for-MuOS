# ================================================================
# Dolphin Rt:Core – Game Setting Override
# ================================================================
#
# Game:        Luigi's Mansion
# Region:      NTSC / USA
# Game ID:     GLME01
#
# Created following the test results and recommendations from:
# Issue: https://github.com/SilverCrow2323/Dolphin-Core-for-MuOS/issues/7
#
# Tester:      Luis Torrão
# Device:      RG4xxxx
# Dolphin Rt:  Core v10.5
#
# This file is applied specifically to this game via GameSettings.
# It overrides global Dolphin.ini / GFX.ini settings for optimal performance.
# ================================================================


# ------------------------------------------------------------------
# [Core] – Dolphin.ini core settings
# ------------------------------------------------------------------
[Core]
# Enable overclocking – set to lower value to improve stability on weaker devices.
Overclock = 0.60000000
OverclockEnable = True

# Use JIT recompiler (faster) and multi-threaded CPU emulation.
CPUCore = 4
CPUThread = True
Fastmem = True

# Use HLE audio emulation (faster than LLE).
DSPHLE = True

# Skip the IPL / BIOS boot screen (speeds up startup).
SkipIPL = True

# Synchronise on skip idle – reduces stutter.
SyncOnSkipIdle = True

# Emulation speed set to 1.0 (normal).
EmulationSpeed = 1.00000000

# Use OpenGL graphics backend (recommended for muOS).
GFXBackend = OGL

# MMU (Memory Management Unit) – disabled for speed.
MMU = False

# Accurate NaNs – disabled for performance.
AccurateNaNs = False

# Extra performance: disabled FPRF (Floating Point Rounding).
FPRF = False


# ------------------------------------------------------------------
# [Video_Settings] – GFX.ini settings (for rendering)
# ------------------------------------------------------------------
[Video_Settings]
# Internal resolution: 66.666...% of native (slightly upscaled) – good balance between quality and performance.
InternalResolution = 66.6666666

# Enable GPU texture decoding (faster texture loading).
EnableGPUTextureDecoding = True

# Disable fog effects – improves performance.
DisableFog = True

# Use EFB to texture (instead of RAM) – faster.
EFBToTextureEnable = True

# Scaled EFB copy – better quality but slightly slower; recommended.
EFBScaledCopy = True

# Disable mipmapping – improves performance on low‑end hardware.
NoMipmapping = True

# Skip duplicate XFB frames – reduces GPU load.
SkipDuplicateXFBs = True

# Force true color – improves visual accuracy.
ForceTrueColor = True

# Use fast depth calculation – improves performance.
FastDepthCalc = True

# Texture cache sample count: 128 – balances memory and performance.
SafeTextureCacheColorSamples = 128

# Shader cache enabled – reduces stutter when shaders compile.
ShaderCache = True

# Wait for shaders before starting – disabled to avoid long loading.
WaitForShadersBeforeStarting = False

# VSync disabled – reduces input lag.
VSync = False


# ------------------------------------------------------------------
# [Hacks] – GFX.ini hacks (enable specific workarounds)
# ------------------------------------------------------------------
[Hacks]
# Enable bounding box – required for some games; it's ON as per recommended settings.
BBoxEnable = True

# Disable EFB access (RAM access) – usually faster.
EFBAccessEnable = False

# Disable EFB emulation of format changes – minor speedup.
EFBEmulateFormatChanges = False

# Vertex rounding – improves geometry accuracy; may help with Luigi's Mansion.
VertexRounding = True

# VISkip – skips vertex information in some games; recommended for performance.
VISkip = True

# Disable Copy Filter – avoids some rendering artifacts.
DisableCopyFilter = False

# Arbitrary mipmap detection – helps with custom textures, but not needed here.
ArbitraryMipmapDetection = True


# ------------------------------------------------------------------
# [Enhancements] – GFX.ini enhancements
# ------------------------------------------------------------------
[Enhancements]
# No post‑processing shader (none selected).
PostProcessingShader =


# ------------------------------------------------------------------
# [DSP] – Audio settings (changed from ALSA to OpenSLES)
# ------------------------------------------------------------------
[DSP]
# Use OpenSLES audio backend (better compatibility on muOS).
Backend = OpenSLES

# Keep JIT enabled for DSP – faster audio processing.
EnableJIT = True

# Audio volume at 100%.
Volume = 100


# ------------------------------------------------------------------
# [General] – Other important settings
# ------------------------------------------------------------------
[General]
# Show FPS and speed colors (useful for testing).
ShowFPS = False
ShowVPS = False
ShowSpeedColors = False
