<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RG35XX-H GameCube Compatibility Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#3b82f6',
              600: '#2563eb',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-sky-500 selection:text-white">

  <!-- Header & Dynamic Stats Bar -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
          <h1 class="text-2xl font-black tracking-tight text-white flex items-center gap-2">
            <span class="text-sky-400">RG35XX-H</span> GameCube DB
            <span class="text-xs font-mono font-normal px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700">Core v10.5.3</span>
          </h1>
          <p class="text-xs text-slate-400 mt-0.5">Optimized emulation dashboard for Allwinner H700 chipset</p>
        </div>

        <!-- Dashboard Metrics -->
        <div class="grid grid-cols-4 gap-2 sm:gap-4 text-center">
          <div class="bg-slate-800/60 border border-slate-700/50 rounded-lg p-2">
            <div class="text-xs text-slate-400">Total</div>
            <div id="statTotal" class="text-lg font-bold font-mono text-slate-100">0</div>
          </div>
          <div class="bg-emerald-950/40 border border-emerald-800/50 rounded-lg p-2">
            <div class="text-xs text-emerald-400">Playable</div>
            <div id="statPlayable" class="text-lg font-bold font-mono text-emerald-400">0</div>
          </div>
          <div class="bg-amber-950/40 border border-amber-800/50 rounded-lg p-2">
            <div class="text-xs text-amber-400">Inconsistent</div>
            <div id="statInconsistent" class="text-lg font-bold font-mono text-amber-400">0</div>
          </div>
          <div class="bg-red-950/40 border border-red-800/50 rounded-lg p-2">
            <div class="text-xs text-red-400">Unplayable</div>
            <div id="statUnplayable" class="text-lg font-bold font-mono text-red-400">0</div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Controls & Filters Bar -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
    <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-4 flex flex-col lg:flex-row gap-4 justify-between items-center shadow-md">
      
      <!-- Search Bar -->
      <div class="relative w-full lg:w-96">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search game title..." 
          class="w-full bg-slate-950 text-slate-200 placeholder-slate-500 border border-slate-700 rounded-lg pl-10 pr-4 py-2 text-sm focus:outline-none focus:border-sky-500 transition-colors"
        >
        <svg class="w-4 h-4 text-slate-500 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>

      <!-- Filters & Sort Options -->
      <div class="flex flex-wrap items-center gap-3 w-full lg:w-auto">
        <!-- Status Filter -->
        <select id="statusFilter" class="bg-slate-950 text-slate-300 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-sky-500">
          <option value="all">Status: All</option>
          <option value="Yes">Playable (Yes)</option>
          <option value="Inconsistent">Inconsistent</option>
          <option value="No">Unplayable (No)</option>
        </select>

        <!-- Region Filter -->
        <select id="regionFilter" class="bg-slate-950 text-slate-300 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-sky-500">
          <option value="all">Region: All</option>
          <option value="USA">USA</option>
          <option value="EUR">EUR</option>
          <option value="JPN">JPN</option>
        </select>

        <!-- Sort Select -->
        <select id="sortBy" class="bg-slate-950 text-slate-300 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-sky-500">
          <option value="score-desc">Score (High &rarr; Low)</option>
          <option value="score-asc">Score (Low &rarr; High)</option>
          <option value="title-asc">Title (A &rarr; Z)</option>
          <option value="title-desc">Title (Z &rarr; A)</option>
        </select>

        <!-- Manual Upload Fallback -->
        <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white font-medium text-sm px-3 py-2 rounded-lg border border-slate-700 transition-colors flex items-center gap-2" title="Manual JSON Upload">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
          </svg>
          Upload JSON
          <input type="file" id="jsonInput" accept=".json" class="hidden">
        </label>
      </div>
    </div>

    <!-- Games Grid -->
    <div id="gamesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
      <!-- Direct Injection via JavaScript -->
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-16 bg-slate-900/30 border border-dashed border-slate-800 rounded-2xl">
      <svg class="w-12 h-12 text-slate-600 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <p id="emptyStateText" class="text-slate-400 font-medium">No games found matching your current filters.</p>
    </div>
  </main>

  <script>
    let gamesData = [];

    const jsonInput = document.getElementById('jsonInput');
    const searchInput = document.getElementById('searchInput');
    const statusFilter = document.getElementById('statusFilter');
    const regionFilter = document.getElementById('regionFilter');
    const sortBy = document.getElementById('sortBy');
    const gamesGrid = document.getElementById('gamesGrid');
    const emptyState = document.getElementById('emptyState');
    const emptyStateText = document.getElementById('emptyStateText');

    // Automatic Load from data/games.json
    async function loadAutomaticData() {
      try {
        const response = await fetch('data/games.json');
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const data = await response.json();
        gamesData = Array.isArray(data) ? data : (data.games || []);
        updateDashboard();
      } catch (error) {
        console.warn('Auto-load failed for data/games.json:', error);
        emptyStateText.textContent = 'Could not load data/games.json automatically. Please upload a JSON file manually.';
        emptyState.classList.remove('hidden');
      }
    }

    // Manual Upload Fallback
    jsonInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const parsed = JSON.parse(event.target.result);
          gamesData = Array.isArray(parsed) ? parsed : (parsed.games || []);
          updateDashboard();
        } catch (err) {
          alert('Error reading JSON file: invalid format.');
        }
      };
      reader.readAsText(file);
    });

    // Event Listeners for Filters
    [searchInput, statusFilter, regionFilter, sortBy].forEach(el => {
      el.addEventListener('input', applyFilters);
    });

    // Stats Calculation
    function updateStats(data) {
      document.getElementById('statTotal').textContent = data.length;
      document.getElementById('statPlayable').textContent = data.filter(g => g.playable === 'Yes').length;
      document.getElementById('statInconsistent').textContent = data.filter(g => g.playable === 'Inconsistent').length;
      document.getElementById('statUnplayable').textContent = data.filter(g => g.playable === 'No').length;
    }

    // Filter & Sort Logic
    function applyFilters() {
      const query = searchInput.value.toLowerCase().trim();
      const status = statusFilter.value;
      const region = regionFilter.value;
      const sort = sortBy.value;

      let filtered = gamesData.filter(game => {
        const matchesQuery = (game.title || '').toLowerCase().includes(query);
        const matchesStatus = status === 'all' || game.playable === status;
        const matchesRegion = region === 'all' || (game.region || '').toUpperCase() === region;
        return matchesQuery && matchesStatus && matchesRegion;
      });

      // Sorting
      filtered.sort((a, b) => {
        const scoreA = parseFloat(a.emulationScore) || 0;
        const scoreB = parseFloat(b.emulationScore) || 0;
        const titleA = (a.title || '').toLowerCase();
        const titleB = (b.title || '').toLowerCase();

        switch (sort) {
          case 'score-desc': return scoreB - scoreA;
          case 'score-asc': return scoreA - scoreB;
          case 'title-asc': return titleA.localeCompare(titleB);
          case 'title-desc': return titleB.localeCompare(titleA);
          default: return 0;
        }
      });

      renderGrid(filtered);
    }

    // Render Game Cards
    function renderGrid(data) {
      if (data.length === 0) {
        gamesGrid.innerHTML = '';
        emptyStateText.textContent = 'No games found matching your current filters.';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      
      const fragment = document.createDocumentFragment();

      data.forEach(game => {
        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-xl p-4 flex flex-col justify-between transition-all duration-200 shadow-sm hover:shadow-md";

        // Status Badge Styling
        let statusBadge = "bg-red-500/10 text-red-400 border-red-500/30";
        if (game.playable === "Yes") statusBadge = "bg-emerald-500/10 text-emerald-400 border-emerald-500/30";
        if (game.playable === "Inconsistent") statusBadge = "bg-amber-500/10 text-amber-400 border-amber-500/30";

        const score = parseFloat(game.emulationScore) || 0;
        let scoreColor = "text-red-400";
        if (score >= 8.0) scoreColor = "text-emerald-400";
        else if (score >= 5.5) scoreColor = "text-amber-400";

        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start gap-2 mb-2">
              <div>
                <h3 class="font-bold text-slate-100 leading-snug">${game.title || 'Untitled Game'}</h3>
                <span class="inline-block text-[10px] font-mono px-1.5 py-0.5 mt-1 rounded bg-slate-800 text-slate-400 border border-slate-700/60 uppercase">
                  ${game.region || 'N/A'}
                </span>
              </div>
              <span class="text-xs font-semibold px-2.5 py-1 rounded-full border shrink-0 ${statusBadge}">
                ${game.playable || 'N/A'}
              </span>
            </div>

            <div class="my-3 flex items-center justify-between border-y border-slate-800/80 py-2">
              <div class="text-xs text-slate-400">Emulation Score</div>
              <div class="text-base font-black font-mono ${scoreColor}">
                ${score.toFixed(1)} <span class="text-xs font-normal text-slate-500">/ 10</span>
              </div>
            </div>

            <div class="space-y-2 text-xs">
              <div class="flex justify-between text-slate-300 font-mono">
                <span class="text-slate-500">FPS:</span>
                <span>${game.fps || 'N/A'}</span>
              </div>
              <div class="flex justify-between text-slate-300 font-mono">
                <span class="text-slate-500">Boots:</span>
                <span class="${game.boots ? 'text-emerald-400' : 'text-red-400'} font-bold">
                  ${game.boots ? 'Yes' : 'No'}
                </span>
              </div>
              
              <div class="pt-2">
                <span class="text-slate-500 font-medium block mb-1 uppercase text-[10px] tracking-wider">Settings:</span>
                <div class="bg-slate-950 p-2 rounded border border-slate-800 text-slate-300 font-mono text-[11px] break-words">
                  ${game.settings || 'No specific settings.'}
                </div>
              </div>

              <div class="pt-1">
                <span class="text-slate-500 font-medium block mb-1 uppercase text-[10px] tracking-wider">Notes:</span>
                <p class="text-slate-400 leading-relaxed text-[11px]">
                  ${game.notes || 'No notes available.'}
                </p>
              </div>
            </div>
          </div>
        `;

        fragment.appendChild(card);
      });

      gamesGrid.innerHTML = '';
      gamesGrid.appendChild(fragment);
    }

    function updateDashboard() {
      updateStats(gamesData);
      applyFilters();
    }

    // Initialize Auto-load on DOM ready
    window.addEventListener('DOMContentLoaded', loadAutomaticData);
  </script>
</body>
</html>
