<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dolphin Rt:Core Compatibility Database</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body.gc {
      background: #0d0716;
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
    }
    body.wii {
      background: #f0f4f8;
      color: #0f172a;
      font-family: 'Inter', sans-serif;
    }

    /* Header */
    .header {
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    body.wii .header {
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .header-logo {
      width: 32px;
      height: 32px;
    }
    .header-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    body.gc .header-title span {
      color: #a78bfa;
    }
    body.wii .header-title span {
      color: #0284c7;
    }

    .console-switch {
      display: flex;
      background: rgba(0,0,0,0.3);
      border-radius: 9999px;
      padding: 0.25rem;
      gap: 0.25rem;
    }
    body.wii .console-switch {
      background: rgba(0,0,0,0.05);
    }
    .console-btn {
      padding: 0.4rem 1rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      background: transparent;
    }
    body.gc .console-btn.active {
      background: #7c3aed;
      color: white;
    }
    body.wii .console-btn.active {
      background: #0284c7;
      color: white;
    }
    body.gc .console-btn:not(.active) {
      color: #94a3b8;
    }
    body.wii .console-btn:not(.active) {
      color: #64748b;
    }
    body.gc .console-btn:hover:not(.active) {
      color: white;
    }
    body.wii .console-btn:hover:not(.active) {
      color: #0f172a;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.8rem;
    }
    .link-btn {
      padding: 0.4rem 0.8rem;
      border-radius: 0.5rem;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s;
    }
    body.gc .link-btn {
      color: #94a3b8;
    }
    body.wii .link-btn {
      color: #64748b;
    }
    body.gc .link-btn:hover {
      color: white;
    }
    body.wii .link-btn:hover {
      color: #0f172a;
    }

    /* Filters */
    .filters {
      padding: 1rem 1.5rem;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
      max-width: 1400px;
      margin: 0 auto;
    }
    .filter-input, .filter-select {
      padding: 0.5rem 0.75rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(0,0,0,0.2);
      color: inherit;
      outline: none;
    }
    body.wii .filter-input, body.wii .filter-select {
      background: white;
      border-color: rgba(0,0,0,0.1);
    }
    .filter-input:focus {
      border-color: #7c3aed;
    }
    body.wii .filter-input:focus {
      border-color: #0284c7;
    }
    .search-box {
      position: relative;
      flex: 1;
      max-width: 300px;
    }
    .search-box input {
      width: 100%;
      padding-left: 2.5rem;
    }
    .search-box svg {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: #94a3b8;
    }
    .view-toggle {
      display: flex;
      background: rgba(0,0,0,0.3);
      border-radius: 0.5rem;
      padding: 0.25rem;
    }
    body.wii .view-toggle {
      background: rgba(0,0,0,0.05);
    }
    .view-toggle button {
      padding: 0.3rem 0.6rem;
      border-radius: 0.4rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: transparent;
      color: #94a3b8;
    }
    body.wii .view-toggle button {
      color: #64748b;
    }
    .view-toggle button.active {
      background: #7c3aed;
      color: white;
    }
    body.wii .view-toggle button.active {
      background: #0284c7;
      color: white;
    }

    /* Stats */
    .stats {
      display: flex;
      gap: 1.5rem;
      padding: 0 1.5rem 0.5rem;
      font-size: 0.8rem;
      color: #94a3b8;
      max-width: 1400px;
      margin: 0 auto;
    }
    body.wii .stats {
      color: #64748b;
    }
    .stats span strong {
      color: #a78bfa;
    }
    body.wii .stats span strong {
      color: #0284c7;
    }

    /* Rating filter */
    .rating-filter {
      display: flex;
      gap: 0.5rem;
      padding: 0 1.5rem 0.75rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    .rating-pill {
      padding: 0.3rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
    }
    .rating-pill[data-rating="5"] { background: rgba(16,185,129,0.15); color: #10b981; border-color: rgba(16,185,129,0.3); }
    .rating-pill[data-rating="4"] { background: rgba(20,184,166,0.15); color: #14b8a6; border-color: rgba(20,184,166,0.3); }
    .rating-pill[data-rating="3"] { background: rgba(245,158,11,0.15); color: #f59e0b; border-color: rgba(245,158,11,0.3); }
    .rating-pill[data-rating="2"] { background: rgba(249,115,22,0.15); color: #f97316; border-color: rgba(249,115,22,0.3); }
    .rating-pill[data-rating="1"] { background: rgba(239,68,68,0.15); color: #ef4444; border-color: rgba(239,68,68,0.3); }
    .rating-pill.active {
      transform: scale(1.05);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    /* Grid */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
      padding: 0 1.5rem 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    .grid-container.list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-width: 700px;
      margin: 0 auto;
    }

    /* Game Card (Grid) */
    .game-card {
      background: rgba(0,0,0,0.3);
      border-radius: 0.75rem;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid rgba(255,255,255,0.05);
    }
    body.wii .game-card {
      background: white;
      border-color: rgba(0,0,0,0.05);
    }
    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
    .game-card-cover {
      aspect-ratio: 3/4;
      width: 100%;
      background: linear-gradient(145deg, #1a1a2e, #16213e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: rgba(255,255,255,0.2);
      position: relative;
    }
    body.wii .game-card-cover {
      background: linear-gradient(145deg, #dce4ec, #c8d4df);
      color: rgba(0,0,0,0.15);
    }
    .game-card-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .game-card-info {
      padding: 0.75rem;
    }
    .game-card-title {
      font-size: 0.85rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 0.5rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .game-card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      font-size: 0.7rem;
    }
    .badge {
      padding: 0.2rem 0.5rem;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.65rem;
    }

    /* List Card */
    .list-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: rgba(0,0,0,0.3);
      border-radius: 0.75rem;
      padding: 0.75rem;
      cursor: pointer;
      transition: background 0.2s;
      border: 1px solid rgba(255,255,255,0.05);
    }
    body.wii .list-card {
      background: white;
      border-color: rgba(0,0,0,0.05);
    }
    .list-card:hover {
      background: rgba(0,0,0,0.4);
    }
    body.wii .list-card:hover {
      background: #f8fafc;
    }
    .list-card-cover {
      width: 56px;
      height: 72px;
      border-radius: 0.5rem;
      overflow: hidden;
      flex-shrink: 0;
      background: rgba(0,0,0,0.2);
    }
    .list-card-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .list-card-info {
      flex: 1;
      min-width: 0;
    }
    .list-card-title {
      font-weight: 700;
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .list-card-meta {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.3rem;
      font-size: 0.7rem;
      color: #94a3b8;
    }
    body.wii .list-card-meta {
      color: #64748b;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s;
    }
    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }
    .modal-card {
      background: #1a1029;
      border-radius: 1rem;
      max-width: 800px;
      width: 95%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.5rem;
      position: relative;
    }
    body.wii .modal-card {
      background: white;
    }
    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.1);
      color: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    body.wii .modal-close {
      background: rgba(0,0,0,0.05);
    }

    /* Footer */
    .footer {
      padding: 1rem 1.5rem;
      text-align: center;
      font-size: 0.75rem;
      color: #94a3b8;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    body.wii .footer {
      border-top: 1px solid rgba(0,0,0,0.05);
      color: #64748b;
    }
    .footer a {
      color: #a78bfa;
    }
    body.wii .footer a {
      color: #0284c7;
    }
  </style>
</head>
<body class="gc">
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <img src="https://raw.githubusercontent.com/SilverCrow2323/Dolphin-Core-for-MuOS/main/assets/dolphinrt.png" alt="Logo" class="header-logo">
      <div class="header-title">Dolphin <span>Rt:Core</span> <span style="font-weight:400">for muOS</span></div>
    </div>
    <div class="console-switch">
      <button class="console-btn active" onclick="switchConsole('gc')">GameCube</button>
      <button class="console-btn" onclick="switchConsole('wii')">Wii</button>
    </div>
    <div class="header-right">
      <a href="https://github.com/SilverCrow2323/Dolphin-Core-for-MuOS/issues/new?template=dolphin-rt-core-test-report.yml" target="_blank" class="link-btn">📤 Send Report</a>
      <a href="https://github.com/SilverCrow2323/Dolphin-Core-for-MuOS" target="_blank" class="link-btn">GitHub</a>
    </div>
  </header>

  <!-- Filters -->
  <div class="filters">
    <div class="search-box">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <input type="text" class="filter-input" id="searchInput" placeholder="Search games...">
    </div>
    <select class="filter-select" id="regionFilter">
      <option value="all">All Regions</option>
      <option value="NTSC">NTSC</option>
      <option value="PAL">PAL</option>
      <option value="JPN">JPN</option>
    </select>
    <select class="filter-select" id="bootFilter">
      <option value="all">All Boots</option>
      <option value="YES">Boots</option>
      <option value="NO">No Boot</option>
    </select>
    <select class="filter-select" id="sortKey">
      <option value="title">Sort: Title</option>
      <option value="rating">Sort: Rating</option>
      <option value="fps">Sort: FPS</option>
      <option value="entries">Sort: Tests</option>
    </select>
    <button class="filter-input" onclick="toggleSortOrder()" style="cursor:pointer">
      <span id="sortOrderLabel">Asc</span>
    </button>
    <div class="view-toggle">
      <button id="gridBtn" class="active" onclick="setViewMode('grid')">Grid</button>
      <button id="listBtn" onclick="setViewMode('list')">List</button>
    </div>
    <button class="filter-input" onclick="resetFilters()" style="cursor:pointer;color:#ef4444">↺ Reset</button>
  </div>

  <!-- Stats -->
  <div class="stats">
    <span><strong id="statGames">0</strong> games</span>
    <span><strong id="statTests">0</strong> tests</span>
  </div>

  <!-- Rating Filter -->
  <div class="rating-filter">
    <button class="rating-pill" data-rating="all" onclick="filterByRating('all')">All</button>
    <button class="rating-pill" data-rating="5" onclick="filterByRating('5')">5★</button>
    <button class="rating-pill" data-rating="4" onclick="filterByRating('4')">4★</button>
    <button class="rating-pill" data-rating="3" onclick="filterByRating('3')">3★</button>
    <button class="rating-pill" data-rating="2" onclick="filterByRating('2')">2★</button>
    <button class="rating-pill" data-rating="1" onclick="filterByRating('1')">1★</button>
  </div>

  <!-- Games Grid/List -->
  <div class="grid-container" id="gamesGrid"></div>

  <!-- Modal -->
  <div class="modal-overlay" id="gameModal">
    <div class="modal-card">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    Powered by <a href="https://github.com/SilverCrow2323/Dolphin-Core-for-MuOS" target="_blank">SPDW Factory</a> · GitHub Issues · GameTDB
  </footer>

  <script>
    // State
    let currentConsole = 'gc';
    let allGames = [];
    let currentGames = [];
    let viewMode = 'grid';
    let searchQuery = '';
    let selectedRegion = 'all';
    let selectedBoot = 'all';
    let selectedRating = 'all';
    let sortKey = 'title';
    let sortOrder = 'asc';

    // Data URL
    const DATA_URL = 'const DATA_URL = 'https://raw.githubusercontent.com/SilverCrow2323/Dolphin-Core-for-MuOS/main/data/games.json';

    // Utility
    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getCoverUrl(gameId, region) {
      if (!gameId) return null;
      const regionMap = { 'NTSC / USA': 'US', 'PAL': 'EN', 'NTSC / JPN': 'JP', 'NTSC / KOR': 'KO' };
      const code = regionMap[region] || 'US';
      return `https://art.gametdb.com/wii/cover/${code}/${gameId}.png`;
    }

    function renderStars(rating) {
      const full = Math.max(0, Math.min(5, rating));
      let html = '<div style="display:flex;gap:2px">';
      for (let i = 1; i <= 5; i++) {
        const filled = i <= full;
        const color = i <= 5 ? (i >= 5 ? '#10b981' : i >= 4 ? '#14b8a6' : i >= 3 ? '#f59e0b' : i >= 2 ? '#f97316' : '#ef4444') : '#94a3b8';
        html += `<svg width="12" height="12" viewBox="0 0 20 20" fill="${filled ? color : 'none'}" stroke="${color}" stroke-width="1.5"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.951-.69H2.578c-.969 0-1.371-1.24-.588-1.81l2.8-2.034a1 1 0 00.364-1.118L4.085 6.21a1 1 0 00.951-.69h3.462a1 1 0 00.951-.69l1.07-3.292z"/></svg>`;
      }
      return html + '</div>';
    }

    // Group games by title + region (best rating per group)
    function groupGames(rawList) {
      const groups = new Map();
      rawList.forEach(entry => {
        const info = entry.game_info || {};
        const title = (info.game || '').trim();
        const region = (info.region || 'Unknown').trim();
        if (!title) return;
        const key = `${title.toLowerCase()}___${region.toLowerCase()}`;
        if (!groups.has(key)) {
          groups.set(key, { game: title, region, entries: [] });
        }
        groups.get(key).entries.push(entry);
      });

      const result = [];
      groups.forEach(group => {
        // Find best entry
        let bestRating = 0;
        let bestFpsStr = '???';
        let bestFpsMax = 0;
        let bestBoot = 'NO';
        let bestPlayable = 'NO';
        let gameId = null;

        group.entries.forEach(entry => {
          const review = entry.test_review || {};
          const info = entry.game_info || {};
          const rating = parseInt(review.rating || 0);
          if (rating > bestRating) bestRating = rating;
          if (review.fps && review.fps !== '???') bestFpsStr = review.fps;
          if (parseInt(review.fps_max || 0) > bestFpsMax) bestFpsMax = parseInt(review.fps_max || 0);
          if (review.boot === 'YES') bestBoot = 'YES';
          if (review.playable === 'YES') bestPlayable = 'YES';
          if (!gameId && info.game_id) gameId = info.game_id;
        });

        result.push({
          game: group.game,
          region: group.region,
          bestRating,
          bestFpsStr,
          bestFpsMax,
          bestBoot,
          bestPlayable,
          gameId,
          entriesCount: group.entries.length,
          entries: group.entries
        });
      });

      return result;
    }

    // Filter + Sort
    function applyFilters() {
      currentGames = allGames.filter(game => {
        if (searchQuery && !game.game.toLowerCase().includes(searchQuery)) return false;
        if (selectedRegion !== 'all' && !game.region.includes(selectedRegion)) return false;
        if (selectedBoot !== 'all' && game.bestBoot !== selectedBoot) return false;
        if (selectedRating !== 'all') {
          const r = parseInt(selectedRating);
          if (r === 1) {
            if (game.bestRating > 1) return false;
          } else if (game.bestRating !== r) return false;
        }
        return true;
      });

      currentGames.sort((a, b) => {
        let cmp = 0;
        if (sortKey === 'title') cmp = a.game.localeCompare(b.game);
        else if (sortKey === 'rating') cmp = a.bestRating - b.bestRating;
        else if (sortKey === 'fps') cmp = a.bestFpsMax - b.bestFpsMax;
        else if (sortKey === 'entries') cmp = a.entriesCount - b.entriesCount;
        return sortOrder === 'asc' ? cmp : -cmp;
      });

      renderGames();
      updateStats();
    }

    // Render games
    function renderGames() {
      const grid = document.getElementById('gamesGrid');
      grid.className = `grid-container ${viewMode === 'list' ? 'list' : ''}`;

      if (currentGames.length === 0) {
        grid.innerHTML = '<p style="padding:2rem;text-align:center;color:#94a3b8">No games found.</p>';
        return;
      }

      if (viewMode === 'grid') {
        grid.innerHTML = currentGames.map(game => `
          <div class="game-card" onclick="openModal(${currentGames.indexOf(game)})">
            <div class="game-card-cover">
              ${game.gameId ? `<img src="${getCoverUrl(game.gameId, game.region)}" alt="${escapeHtml(game.game)}" loading="lazy" onerror="this.style.display='none'">` : ''}
              <span>🎮</span>
            </div>
            <div class="game-card-info">
              <div class="game-card-title">${escapeHtml(game.game)}</div>
              <div style="margin-bottom:0.4rem">${renderStars(game.bestRating)}</div>
              <div class="game-card-meta">
                <span class="badge" style="background:rgba(16,185,129,0.15);color:#10b981">${game.bestPlayable === 'YES' ? 'Playable' : 'Unplayable'}</span>
                <span class="badge" style="background:rgba(239,68,68,0.15);color:#ef4444">${game.bestBoot === 'YES' ? 'Boots' : 'No Boot'}</span>
                <span class="badge" style="background:rgba(56,189,248,0.15);color:#38bdf8">${game.bestFpsStr !== '???' ? game.bestFpsStr + ' FPS' : 'N/A'}</span>
              </div>
            </div>
          </div>
        `).join('');
      } else {
        grid.innerHTML = currentGames.map(game => `
          <div class="list-card" onclick="openModal(${currentGames.indexOf(game)})">
            <div class="list-card-cover">
              ${game.gameId ? `<img src="${getCoverUrl(game.gameId, game.region)}" alt="${escapeHtml(game.game)}" loading="lazy" onerror="this.style.display='none'">` : ''}
            </div>
            <div class="list-card-info">
              <div class="list-card-title">${escapeHtml(game.game)}</div>
              <div class="list-card-meta">
                <span>${game.region}</span>
                <span>${game.entriesCount} tests</span>
                <span style="color:${game.bestPlayable === 'YES' ? '#10b981' : '#ef4444'}">${game.bestPlayable === 'YES' ? 'Playable' : 'Unplayable'}</span>
                <span style="color:${game.bestBoot === 'YES' ? '#10b981' : '#ef4444'}">${game.bestBoot === 'YES' ? 'Boots' : 'No Boot'}</span>
                <span style="color:#38bdf8">${game.bestFpsStr !== '???' ? game.bestFpsStr + ' FPS' : 'N/A'}</span>
              </div>
              <div style="margin-top:0.3rem">${renderStars(game.bestRating)}</div>
            </div>
          </div>
        `).join('');
      }
    }

    // Modal
    function openModal(index) {
      const game = currentGames[index];
      if (!game) return;
      const modal = document.getElementById('gameModal');
      const content = document.getElementById('modalContent');

      let html = `
        <div style="display:flex;gap:1rem;margin-bottom:1rem">
          <div style="width:100px;height:140px;border-radius:0.5rem;overflow:hidden;background:rgba(0,0,0,0.2)">
            ${game.gameId ? `<img src="${getCoverUrl(game.gameId, game.region)}" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display='none'">` : ''}
          </div>
          <div style="flex:1">
            <h2 style="font-size:1.5rem;font-weight:800;margin-bottom:0.3rem">${escapeHtml(game.game)}</h2>
            <p style="color:#94a3b8;margin-bottom:0.5rem">${game.region} · ${game.gameId || 'Unknown'}</p>
            <div style="display:flex;gap:0.5rem;flex-wrap:wrap">
              <span class="badge" style="background:rgba(16,185,129,0.15);color:#10b981">${game.bestPlayable === 'YES' ? 'Playable' : 'Unplayable'}</span>
              <span class="badge" style="background:rgba(239,68,68,0.15);color:#ef4444">${game.bestBoot === 'YES' ? 'Boots' : 'No Boot'}</span>
              <span class="badge" style="background:rgba(56,189,248,0.15);color:#38bdf8">${game.bestFpsStr !== '???' ? game.bestFpsStr + ' FPS' : 'N/A'}</span>
            </div>
          </div>
        </div>
        <div style="margin-bottom:1rem">${renderStars(game.bestRating)} <span style="font-size:0.8rem;color:#94a3b8">(${game.entriesCount} tests)</span></div>
        <h3 style="font-size:1rem;font-weight:700;margin-bottom:0.5rem">Test Results</h3>
      `;

      game.entries.forEach((entry, idx) => {
        const review = entry.test_review || {};
        const details = entry.test_details || {};
        const env = entry.test_environment || {};
        const rating = parseInt(review.rating || 0);
        const boot = review.boot || (rating >= 1 ? 'YES' : 'NO');
        const playable = review.playable || (rating >= 3 ? 'YES' : 'NO');
        const fps = review.fps || '???';
        const coreVersion = details.rtcore_version || 'Unknown';
        const coreProfile = details.core_profile || 'Unknown';
        const considerations = details.considerations || '';
        const tester = env.tester || 'Anonymous';
        const device = env.device || 'Unknown';
        const muos = env.muos_version || 'Unknown';

        html += `
          <div style="padding:0.75rem;border-radius:0.5rem;background:rgba(0,0,0,0.1);margin-bottom:0.5rem">
            <div style="display:flex;justify-content:space-between;margin-bottom:0.5rem">
              <span style="font-size:0.8rem;font-weight:700">Test #${idx + 1}</span>
              <span style="font-size:0.8rem;color:#94a3b8">${escapeHtml(tester)}</span>
            </div>
            <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.5rem">
              <span class="badge" style="background:rgba(16,185,129,0.15);color:#10b981">${boot === 'YES' ? 'Boots' : 'No Boot'}</span>
              <span class="badge" style="background:rgba(16,185,129,0.15);color:#10b981">${playable === 'YES' ? 'Playable' : 'Unplayable'}</span>
              <span class="badge" style="background:rgba(56,189,248,0.15);color:#38bdf8">${fps} FPS</span>
              <span class="badge" style="background:rgba(124,58,237,0.15);color:#a78bfa">${escapeHtml(coreProfile)}</span>
            </div>
            ${considerations ? `<p style="font-size:0.8rem;font-style:italic;color:#94a3b8">${escapeHtml(considerations)}</p>` : ''}
            <div style="font-size:0.75rem;color:#94a3b8;margin-top:0.3rem">Device: ${escapeHtml(device)} · muOS: ${escapeHtml(muos)}</div>
            ${renderStars(rating)}
          </div>
        `;
      });

      content.innerHTML = html;
      modal.classList.add('open');
    }

    function closeModal() {
      document.getElementById('gameModal').classList.remove('open');
    }

    // Load data
    async function loadData() {
      try {
        const res = await fetch(DATA_URL);
        if (!res.ok) throw new Error('Network error');
        const data = await res.json();
        const system = currentConsole === 'gc' ? 'GC' : 'Wii';
        const filtered = data.games.filter(g => (g.game_info?.system || '') === system);
        allGames = groupGames(filtered);
        applyFilters();
      } catch (err) {
        console.error(err);
        document.getElementById('gamesGrid').innerHTML = '<p style="padding:2rem;text-align:center;color:#ef4444">Error loading data. Check connection.</p>';
      }
    }

    // Actions
    function switchConsole(target) {
      currentConsole = target;
      document.body.className = target === 'gc' ? 'gc' : 'wii';
      document.querySelectorAll('.console-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.toLowerCase() === target);
      });
      loadData();
    }

    function setViewMode(mode) {
      viewMode = mode;
      document.getElementById('gridBtn').classList.toggle('active', mode === 'grid');
      document.getElementById('listBtn').classList.toggle('active', mode === 'list');
      renderGames();
    }

    function filterByRating(r) {
      selectedRating = r;
      document.querySelectorAll('.rating-pill').forEach(pill => {
        pill.classList.toggle('active', pill.dataset.rating === r);
      });
      applyFilters();
    }

    function toggleSortOrder() {
      sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
      document.getElementById('sortOrderLabel').textContent = sortOrder === 'asc' ? 'Asc' : 'Desc';
      applyFilters();
    }

    function resetFilters() {
      searchQuery = '';
      document.getElementById('searchInput').value = '';
      selectedRegion = 'all';
      document.getElementById('regionFilter').value = 'all';
      selectedBoot = 'all';
      document.getElementById('bootFilter').value = 'all';
      sortKey = 'title';
      document.getElementById('sortKey').value = 'title';
      sortOrder = 'asc';
      document.getElementById('sortOrderLabel').textContent = 'Asc';
      selectedRating = 'all';
      filterByRating('all');
      applyFilters();
    }

    // Events
    document.getElementById('searchInput').addEventListener('input', e => {
      searchQuery = e.target.value.toLowerCase().trim();
      applyFilters();
    });
    document.getElementById('regionFilter').addEventListener('change', e => {
      selectedRegion = e.target.value;
      applyFilters();
    });
    document.getElementById('bootFilter').addEventListener('change', e => {
      selectedBoot = e.target.value;
      applyFilters();
    });
    document.getElementById('sortKey').addEventListener('change', e => {
      sortKey = e.target.value;
      applyFilters();
    });
    document.getElementById('gameModal').addEventListener('click', e => {
      if (e.target === document.getElementById('gameModal')) closeModal();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });

    // Initialize
    loadData();
  </script>
</body>
</html>
