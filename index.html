<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐬 Dolphin Core for MuOS | GameCube Compatibility Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#3b82f6', 600: '#2563eb' }
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #020617; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
    
    /* Smooth fade in for images */
    .cover-img {
      opacity: 0;
      transition: opacity 0.3s ease-in, transform 0.3s ease-in-out;
    }
    .cover-img.loaded {
      opacity: 1;
    }

</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-sky-500 selection:text-white">

  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
          <h1 class="font-black tracking-tight text-white flex flex-col gap-1">
            <div class="text-2xl flex items-center gap-2">
              <span>🐬</span> Dolphin Core for MuOS
              <span class="text-xs font-mono font-normal px-2.5 py-1 rounded-full bg-sky-950 text-sky-400 border border-sky-800">Core version: v10.5.300</span>
            </div>
            <div class="text-xl text-slate-200 flex items-center gap-2 mt-0.5">
              <svg class="h-6 w-auto inline-block" viewBox="0 0 120 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                <text x="0" y="22" fill="#7dd3fc" font-family="monospace" font-weight="bold" font-size="18">GAMECUBE</text>
              </svg>
              <span>Compatibility Dashboard</span>
            </div>
          </h1>
          <p class="text-xs italic text-slate-400 mt-1">
            Community driven testing database for GameCube emulation performance on muOS & H700 chipset
          </p>
        </div>
        <div class="grid grid-cols-4 gap-2 sm:gap-3 text-center shrink-0">
          <div class="bg-slate-800/60 border border-slate-700/50 rounded-lg p-2">
            <div class="text-[10px] uppercase font-semibold text-slate-400">Total</div>
            <div id="statTotal" class="text-base font-bold font-mono text-slate-100">0</div>
          </div>
          <div class="bg-emerald-950/40 border border-emerald-800/50 rounded-lg p-2">
            <div class="text-[10px] uppercase font-semibold text-emerald-400">Perfect (5★)</div>
            <div id="statPerfect" class="text-base font-bold font-mono text-emerald-400">0</div>
          </div>
          <div class="bg-amber-950/40 border border-amber-800/50 rounded-lg p-2">
            <div class="text-[10px] uppercase font-semibold text-amber-400">Playable (3-4★)</div>
            <div id="statPlayable" class="text-base font-bold font-mono text-amber-400">0</div>
          </div>
          <div class="bg-red-950/40 border border-red-800/50 rounded-lg p-2">
            <div class="text-[10px] uppercase font-semibold text-red-400">Unplayable (0-2★)</div>
            <div id="statKO" class="text-base font-bold font-mono text-red-400">0</div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>
      
      <div class="flex flex-wrap items-center gap-3 w-full xl:w-auto">
        <select id="starsFilter" class="bg-slate-950 text-slate-300 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-sky-500">
          <option value="all">Stars: All</option>
          <option value="5">5★ - Perfect!</option>
          <option value="4">4★ - Playable with issues</option>
          <option value="3">3★ - Inconsistent</option>
          <option value="2">2★ - Disaster but tries</option>
          <option value="1">1★ - Better not</option>
          <option value="0">0★ - Doesn't boot</option>

        <select id="regionFilter" class="bg-slate-950 text-slate-300 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-sky-500">
          <option value="all">Region: All</option>
          <option value="PAL">PAL</option>
          <option value="NTSC">NTSC / USA</option>
          <option value="JPN">JPN</option>
        </select>
        
        <select id="sortKey" class="bg-slate-950 text-slate-300 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-sky-500">
          <option value="title">Sort: Title</option>
          <option value="stars">Sort: Stars</option>
          <option value="fps">Sort: FPS</option>
        </select>
        
        <button id="sortOrderBtn" class="bg-slate-950 text-slate-300 border border-slate-700 hover:border-slate-500 px-3 py-2 rounded-lg text-sm flex items-center gap-1.5 transition-colors">
          <span id="sortOrderLabel">Asc</span>
          <svg id="sortOrderIcon" class="w-4 h-4 transition-transform duration-200 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>

        <button id="resetFiltersBtn" class="bg-rose-950/30 text-rose-400 border border-rose-900/50 hover:bg-rose-900/40 hover:text-rose-300 px-3 py-2 rounded-lg text-sm font-medium transition-colors hidden lg:block">
          Reset
        </button>
        
        <div class="flex bg-slate-950 p-1 rounded-lg border border-slate-700 ml-auto xl:ml-0">
          <button id="viewGridBtn" class="px-2.5 py-1 rounded-md text-xs font-semibold flex items-center gap-1 bg-sky-600 text-white transition-all">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
            Grid
          </button>
          <button id="viewListBtn" class="px-2.5 py-1 rounded-md text-xs font-semibold flex items-center gap-1 text-slate-400 hover:text-slate-200 transition-all">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
            List
          </button>
        </div>
      </div>
    </div>

    <div id="gamesContainer"></div>
    <div id="emptyState" class="hidden text-center py-16 bg-slate-900/30 border border-dashed border-slate-800 rounded-2xl">
      <svg class="w-12 h-12 text-slate-600 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <p id="emptyStateText" class="text-slate-400 font-medium">No games found with the current filters.</p>
      <button onclick="document.getElementById('resetFiltersBtn').click()" class="mt-4 px-4 py-2 bg-sky-600 text-white rounded-lg text-sm font-medium hover:bg-sky-500 transition-colors">
        Clear all filters
      </button>
    </div>
  </main>

    let gamesData = [];

    const RATING_CONFIG = {
      0: { label: "doesn't boot", color: "text-red-500", bg: "bg-red-500/10 border-red-500/30" },
      1: { label: "boots but unplayable", color: "text-rose-400", bg: "bg-rose-500/10 border-rose-500/30" },
      2: { label: "disaster but tries", color: "text-orange-400", bg: "bg-orange-500/10 border-orange-500/30" },
      3: { label: "inconsistent", color: "text-amber-400", bg: "bg-amber-500/10 border-amber-500/30" },

      5: { label: "perfect!", color: "text-emerald-400", bg: "bg-emerald-500/10 border-emerald-500/30" }
    };

    function getGameTitle(game) {
      return game.game || 'Untitled';
    }

    function getCoverUrl(game) {
      if (game.coverUrl) return game.coverUrl;
      
      // Migliorato il parsing del titolo per matchare più link su Libretro
      let cleanTitle = getGameTitle(game)
        .replace(/&/g, 'and')
        .replace(/:/g, ' -')
        .replace(/[\\/*?"<>|]/g, '_')
        .replace(/\s+/g, ' ')
        .trim();
        
      return `https://raw.githubusercontent.com/libretro/libretro-thumbnails/master/Nintendo%20-%20GameCube/Named_Boxarts/${encodeURIComponent(cleanTitle)}.png`;
    }

    function parseMaxFPS(fpsStr) {
      if (!fpsStr || fpsStr === '???') return 0;
      if (fpsStr.includes('-')) {
        const parts = fpsStr.split('-');
        return parseInt(parts[1]) || parseInt(parts[0]) || 0;
      }
      return parseInt(fpsStr) || 0;
    }

    function calculateStars(game) {
      const runs = (game['runs?'] || '').toUpperCase() === 'YES';
      const playable = (game.playable || '').toUpperCase() === 'YES';
      const maxFps = parseMaxFPS(game.fps);

      if (!runs) return 0;

      if (playable) {
        if (maxFps >= 35) return 5;
        if (maxFps >= 25) return 4;
        if (maxFps >= 15) return 3;
        if (maxFps >= 10) return 2;
        return 1;
      } else {
        if (maxFps >= 25) return 3;
        if (maxFps >= 15) return 2;
        if (maxFps >= 1) return 1;
        return 1;
      }
    }

    function renderStarsHTML(starsCount) {
      const config = RATING_CONFIG[starsCount] || RATING_CONFIG[0];
      let starsHtml = '';
      for (let i = 1; i <= 5; i++) {
        const filled = i <= starsCount;
        starsHtml += `<svg class="w-4 h-4 ${filled ? config.color : 'text-slate-700'}" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>`;
      }
      return starsHtml;
    }

    function checkProfileActive(coreStr, profileName) {
      if (!coreStr) return false;
      const s = coreStr.toLowerCase();
      if (s.includes('all of') || s.includes('all fo')) return true;
      if (profileName === 'default') return s.includes('default') || s.includes('standard') || s.includes('stock');
      if (profileName === 'speed hack') return s.includes('speed') || s.includes('hack') || s.includes('overclock') || s.includes('efb');
      if (profileName === 'black screen fix') return s.includes('black') || s.includes('screen') || s.includes('xfb') || s.includes('fix');
      return false;
    }

    function getBoots(game) { return (game['runs?'] || '').toUpperCase() === 'YES'; }
    function getPlayable(game) { return (game.playable || '').toUpperCase() === 'YES'; }
    function getConsiderations(game) { return game.considerations || 'No additional notes.'; }
    function getSource(game) { return game.source || 'Community'; }
    function getRegion(game) { return game.region || 'PAL'; }
    function getCore(game) { return game.core || ''; }
    function getFPS(game) { return game.fps || 'N/A'; }

    function loadData() {
      gamesData = EMBEDDED_GAMES;

    const searchInput = document.getElementById('searchInput');

    const emptyState = document.getElementById('emptyState');

    viewGridBtn.addEventListener('click', () => {

      applyFilters();
    });

    viewListBtn.addEventListener('click', () => {
      currentView = 'list';

      viewGridBtn.className = "px-2.5 py-1 rounded-md text-xs font-semibold flex items-center gap-1 text-slate-400 hover:text-slate-200 transition-all";
      applyFilters();
    });

    sortOrderBtn.addEventListener('click', () => {
      isAscending = !isAscending;
      sortOrderLabel.textContent = isAscending ? 'Asc' : 'Desc';
      sortOrderIcon.style.transform = isAscending ? 'rotate(180deg)' : 'rotate(0deg)';
      applyFilters();
    });

    resetFiltersBtn.addEventListener('click', () => {
      searchInput.value = '';
      starsFilter.value = 'all';
      regionFilter.value = 'all';
      sortKey.value = 'title';
      isAscending = true;
      sortOrderLabel.textContent = 'Asc';
      sortOrderIcon.style.transform = 'rotate(180deg)';
      applyFilters();
    });

    [searchInput, starsFilter, regionFilter, sortKey].forEach(el => {
      el.addEventListener('input', applyFilters);
    });

    function updateStats(data) {
      document.getElementById('statTotal').textContent = data.length;
      document.getElementById('statPerfect').textContent = data.filter(g => calculateStars(g) === 5).length;
      document.getElementById('statPlayable').textContent = data.filter(g => {
        const s = calculateStars(g);
        return s === 3 || s === 4;
      }).length;
      document.getElementById('statKO').textContent = data.filter(g => calculateStars(g) <= 2).length;
    }

    function applyFilters() {
      const query = searchInput.value.toLowerCase().trim();
      const starsVal = starsFilter.value;
      const region = regionFilter.value;
      const key = sortKey.value;

      let filtered = gamesData.filter(game => {
        const stars = calculateStars(game);
        const title = getGameTitle(game).toLowerCase();
        const matchesQuery = title.includes(query);
        const matchesStars = starsVal === 'all' || stars === parseInt(starsVal);
        const matchesRegion = region === 'all' || getRegion(game).toUpperCase().includes(region);
        return matchesQuery && matchesStars && matchesRegion;
      });

      filtered.sort((a, b) => {
        let valA, valB;
        if (key === 'stars') {
          valA = calculateStars(a);
          valB = calculateStars(b);
        } else if (key === 'fps') {
          valA = parseMaxFPS(getFPS(a));
          valB = parseMaxFPS(getFPS(b));
        } else {
          valA = getGameTitle(a).toLowerCase();
          valB = getGameTitle(b).toLowerCase();
        }
        if (valA < valB) return isAscending ? -1 : 1;
        if (valA > valB) return isAscending ? 1 : -1;
        return 0;
      });

      renderView(filtered);
    }

    function renderView(data) {
      if (data.length === 0) {
        gamesContainer.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');
      if (currentView === 'grid') {
        renderGridView(data);
      } else {
        renderListView(data);
      }
    }

    function renderGridView(data) {

        const stars = calculateStars(game);
        const ratingConfig = RATING_CONFIG[stars] || RATING_CONFIG[0];
        const boots = getBoots(game);
        const playable = getPlayable(game);
        const core = getCore(game);
        const title = getGameTitle(game);
        const considerationText = getConsiderations(game);
        const coverUrl = getCoverUrl(game);
        const source = getSource(game);
        const region = getRegion(game);
        const fps = getFPS(game);

        const bootBadge = boots 
          ? `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">✔ BOOT</span>`
          : `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-red-500/10 text-red-400 border border-red-500/30">✖ BOOT</span>`;

        const playableBadge = playable 
          ? `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">✔ PLAY</span>`
          : `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-red-500/10 text-red-400 border border-red-500/30">✖ PLAY</span>`;

        const isDefault = checkProfileActive(core, 'default');
        const isSpeed = checkProfileActive(core, 'speed hack');
        const isBlackScreen = checkProfileActive(core, 'black screen fix');

        card.innerHTML = `
          <div>
            <div class="relative h-56 bg-slate-950 overflow-hidden flex items-center justify-center border-b border-slate-800">
              <!-- Fallback visivo "dietro" l'immagine -->
              <div class="absolute inset-0 flex flex-col items-center justify-center text-slate-700 bg-slate-950 z-0">
                <svg class="w-10 h-10 mb-2 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                <span class="text-[10px] font-mono font-bold tracking-widest opacity-40">NO COVER</span>
              </div>
              
              <!-- Immagine con gestore onerror -->
              <img src="${coverUrl}" alt="${title}" 
                class="cover-img h-full object-contain relative z-10 group-hover:scale-105 shadow-xl"
                onload="this.classList.add('loaded'); this.classList.add('bg-slate-950/80');"
                onerror="this.style.display='none';" />
                
              <span class="absolute top-2 left-2 text-[10px] font-mono font-bold px-2 py-0.5 rounded bg-slate-900/90 text-sky-400 border border-sky-800 uppercase z-20 backdrop-blur-sm shadow">${region}</span>
            </div>
            
            <div class="p-4 space-y-3">
              <div>
                <h3 class="font-bold text-slate-100 text-base leading-tight line-clamp-1" title="${title}">${title}</h3>
              </div>
              
              <div class="bg-slate-950/70 p-2.5 rounded-lg border border-slate-800">
                <div class="flex items-center justify-between gap-1 mb-1">
                  <div class="flex items-center gap-0.5">${renderStarsHTML(stars)}</div>
                  <span class="text-xs font-mono font-bold ${ratingConfig.color}">${stars}/5</span>
                </div>
                <div class="text-[11px] font-medium ${ratingConfig.color} italic">"${ratingConfig.label}"</div>
              </div>
              
              <div class="flex items-center justify-between text-xs gap-1 border-y border-slate-800/80 py-2">
                <div class="flex items-center gap-1.5">${bootBadge}${playableBadge}</div>
                <div class="font-mono text-xs text-slate-300">
                  <span class="text-slate-500">FPS:</span> <strong class="text-slate-100">${fps}</strong>
                </div>
              </div>
              
              <div>
                <span class="text-slate-500 font-medium block mb-1.5 uppercase text-[10px] tracking-wider">Tested Cores:</span>
                <div class="grid grid-cols-3 gap-1 text-[10px] font-mono text-center">
                  <div class="p-1 rounded border ${isDefault ? 'bg-sky-950 text-sky-300 border-sky-700 font-bold' : 'bg-slate-950/40 text-slate-600 border-slate-800 opacity-50'}">Default</div>
                  <div class="p-1 rounded border ${isSpeed ? 'bg-amber-950 text-amber-300 border-amber-700 font-bold' : 'bg-slate-950/40 text-slate-600 border-slate-800 opacity-50'}">Speed</div>
                  <div class="p-1 rounded border ${isBlackScreen ? 'bg-purple-950 text-purple-300 border-purple-700 font-bold' : 'bg-slate-950/40 text-slate-600 border-slate-800 opacity-50'}">Fix</div>
                </div>
              </div>
              
              <div class="pt-1">
                <span class="text-slate-500 font-medium block mb-1 uppercase text-[10px] tracking-wider flex justify-between items-center">
                  Notes
                  <span class="text-sky-500 lowercase font-mono">@${source}</span>
                </span>
                <div class="bg-slate-950 p-2.5 rounded border border-slate-800 text-[11px] text-slate-300 space-y-1 h-20 overflow-y-auto custom-scrollbar">
                  <p class="italic leading-relaxed text-slate-400">"${considerationText.replace(/\n/g, '<br>')}"</p>
                </div>
              </div>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      gamesContainer.innerHTML = '';
      gamesContainer.appendChild(grid);
    }

    function renderListView(data) {
      const wrapper = document.createElement('div');
      wrapper.className = "bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-md";

      let rowsHtml = data.map(game => {
        const stars = calculateStars(game);
        const ratingConfig = RATING_CONFIG[stars] || RATING_CONFIG[0];
        const boots = getBoots(game);
        const playable = getPlayable(game);
        const coverUrl = getCoverUrl(game);
        const title = getGameTitle(game);
        const source = getSource(game);
        const considerationText = getConsiderations(game);
        const region = getRegion(game);
        const fps = getFPS(game);

        return `
          <tr class="border-b border-slate-800/60 hover:bg-slate-800/40 transition-colors text-xs group">
            <td class="py-2.5 px-3 w-12 text-center">
              <div class="relative h-10 w-8 mx-auto bg-slate-950 border border-slate-800 rounded flex items-center justify-center overflow-hidden">
                <svg class="w-4 h-4 text-slate-700 absolute z-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                <img src="${coverUrl}" alt="" class="h-full w-full object-cover relative z-10 cover-img" 
                  onload="this.classList.add('loaded')" 
                  onerror="this.style.display='none'"/>
              </div>
            </td>
            <td class="py-2.5 px-3 font-bold text-slate-100">${title}</td>
            <td class="py-2.5 px-3 font-mono text-slate-400 uppercase">${region}</td>
            <td class="py-2.5 px-3">
              <div class="flex items-center gap-1">${renderStarsHTML(stars)}</div>
              <span class="text-[10px] ${ratingConfig.color}">${ratingConfig.label}</span>
            </td>
            <td class="py-2.5 px-3 font-mono text-slate-300">${fps}</td>
            <td class="py-2.5 px-3 font-mono">
              <span class="${boots ? 'text-emerald-400' : 'text-red-400'} font-bold">${boots ? '✔ BOOT' : '✖ BOOT'}</span>
            </td>
            <td class="py-2.5 px-3 font-mono">
              <span class="${playable ? 'text-emerald-400' : 'text-red-400'} font-bold">${playable ? '✔ PLAY' : '✖ PLAY'}</span>
            </td>
            <td class="py-2.5 px-3 text-slate-400 max-w-xs truncate italic group-hover:whitespace-normal group-hover:break-words transition-all duration-300">
              "${considerationText.replace(/\n/g, ' ')}" <span class="text-sky-400 font-semibold block mt-0.5">— @${source}</span>
            </td>
          </tr>
        `;
      }).join('');

      wrapper.innerHTML = `
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-950/80 border-b border-slate-800 text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                <th class="py-3 px-3 text-center">Cover</th>
                <th class="py-3 px-3">Game</th>
                <th class="py-3 px-3">Region</th>
                <th class="py-3 px-3">Rating</th>
                <th class="py-3 px-3">FPS</th>
                <th class="py-3 px-3">Boot</th>
                <th class="py-3 px-3">Playable</th>
                <th class="py-3 px-3">Considerations</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-800/40">
              ${rowsHtml}
            </tbody>
          </table>
        </div>
      `;

      gamesContainer.innerHTML = '';
      gamesContainer.appendChild(wrapper);
    }

    function updateDashboard() {
      updateStats(gamesData);
      applyFilters();
    }

    window.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
