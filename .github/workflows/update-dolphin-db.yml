name: Update Dolphin Database from Issues

on:
  issues:
    types: [closed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process manually (e.g., 12)'
        required: false
        type: string

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  update-db:
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'test-report') ||
      contains(github.event.issue.labels.*.name, 'game-test') ||
      contains(github.event.issue.labels.*.name, 'wii-game-test')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Process Issue and Update JSON
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_ISSUE: ${{ inputs.issue_number }}
        run: |
          python3 << 'PYSCRIPT'
          import json, os, re, sys, subprocess
          from difflib import get_close_matches

          # ---------- Ottieni il corpo della issue ----------
          issue_body = ""
          issue_number = ""
          if os.environ.get('MANUAL_ISSUE'):
              issue_num = os.environ.get('MANUAL_ISSUE')
              result = subprocess.run(['gh', 'issue', 'view', issue_num, '--json', 'body', '-q', '.body'],
                                      capture_output=True, text=True)
              issue_body = result.stdout
              issue_number = issue_num
          else:
              issue_body = "${{ github.event.issue.body }}"
              issue_number = "${{ github.event.issue.number }}"

          # ---------- Funzioni di estrazione ----------
          def extract_val(label, body):
              if not body:
                  return ""
              safe_label = re.escape(label)
              pattern = rf"###\s*{safe_label}\s*\n\s*(.*?)(?=\n###\s|\Z)"
              match = re.search(pattern, body, re.DOTALL)
              if not match:
                  return ""
              val = match.group(1).strip()
              val = re.sub(r'\*\*(.*?)\*\*', r'\1', val)
              val = re.sub(r'\*(.*?)\*', r'\1', val)
              val = re.sub(r'^\s*[-\*]\s*', '', val, flags=re.MULTILINE).strip()
              if val.lower() in ["_no response_", "no response", "n/a", "none"]:
                  return ""
              return val

          def parse_fps(fps_str):
              if not fps_str or fps_str == '???':
                  return (0, 0)
              nums = [int(n) for n in re.findall(r'\d+', fps_str)]
              if len(nums) >= 2:
                  return (min(nums[0], nums[1]), max(nums[0], nums[1]))
              elif len(nums) == 1:
                  return (nums[0], nums[0])
              return (0, 0)

          def yes_no(val):
              v = val.strip().lower()
              return "YES" if ("yes" in v or "true" in v) else "NO"

          # ---------- Caricamento database GameTDB locale ----------
          def load_game_id_mapping():
              mapping = {}
              db_path = "data/database/wiitdb.txt"
              if not os.path.exists(db_path):
                  print("⚠️ wiitdb.txt not found. Proceeding without mapping.")
                  return mapping
              with open(db_path, "r", encoding="utf-8") as f:
                  for line in f:
                      line = line.strip()
                      if not line or line.startswith('#') or line.startswith('TITLES ='):
                          continue
                      parts = line.split(' = ')
                      if len(parts) == 2:
                          game_id = parts[0].strip()
                          title = parts[1].strip()
                          if game_id[0] in ['G', 'R']:
                              mapping[title.lower()] = game_id
                              clean = re.sub(r'[^\w\s]', '', title).lower()
                              mapping[clean] = game_id
                              if title.lower().startswith('the '):
                                  mapping[title.lower()[4:]] = game_id
              return mapping

          def find_game_id(title, region, game_id_mapping):
              if not title or not game_id_mapping:
                  return None
              clean_title = re.sub(r'[^\w\s]', '', title).strip().lower()
              clean_region = "ntsc" if "ntsc" in region.lower() else "pal"
              for mapped_title, game_id in game_id_mapping.items():
                  if clean_title in mapped_title or mapped_title in clean_title:
                      region_char = game_id[-1]
                      if clean_region == "ntsc" and region_char in ['E', 'U', 'K', 'W']:
                          return game_id
                      elif clean_region == "pal" and region_char == 'P':
                          return game_id
              matches = get_close_matches(clean_title, game_id_mapping.keys(), n=1, cutoff=0.6)
              if matches:
                  return game_id_mapping[matches[0]]
              return None

          # ---------- Normalizzazione ID esistenti ----------
          def normalize_ids(json_path, game_id_mapping):
              if not os.path.exists(json_path):
                  return
              with open(json_path, "r", encoding="utf-8") as f:
                  data = json.load(f)
              changed = False
              for entry in data:
                  old_id = entry.get("game_id", "")
                  if not old_id or old_id == "UNKNOWN":
                      continue
                  title = entry.get("game", "")
                  region = entry.get("region", "NTSC / USA")
                  if title:
                      correct_id = find_game_id(title, region, game_id_mapping)
                      if correct_id and correct_id != old_id:
                          print(f"  🔄 {old_id} → {correct_id} ({title})")
                          entry["game_id"] = correct_id
                          if "configuration" in entry and "game_settings" in entry["configuration"]:
                              entry["configuration"]["game_settings"] = f"{correct_id}_default.ini"
                          if "profile_recommendation" in entry and "game_settings" in entry["profile_recommendation"]:
                              entry["profile_recommendation"]["game_settings"] = f"{correct_id}_default.ini"
                          changed = True
              if changed:
                  with open(json_path, "w", encoding="utf-8") as f:
                      json.dump(data, f, indent=2, ensure_ascii=False)
                  print(f"✅ IDs normalized in {json_path}")
              else:
                  print(f"ℹ️ No IDs to normalize in {json_path}")

          # ---------- Estrai dati dalla issue ----------
          platform = extract_val("Platform", issue_body) or "GameCube"
          game_title = extract_val("Game Title", issue_body)
          region = extract_val("Region", issue_body) or "NTSC / USA"
          fps_raw = extract_val("FPS Range", issue_body)
          core_profile = extract_val("Core Profile Used", issue_body) or "default"
          core_version = extract_val("Dolphin Rt:Core Version", issue_body) or "v10.5.300"
          considerations = extract_val("Considerations & Notes", issue_body)
          if not considerations:
              considerations = extract_val("Considerazioni & Note", issue_body)
          tester = extract_val("Tester Username", issue_body) or "Anonymous"
          device = extract_val("Device Used", issue_body) or "Unknown Device"
          muos_version = extract_val("muOS Version", issue_body) or "2601.1 Funky Jacaranda (current)"
          screenshots = extract_val("Screenshots / Video Links (optional)", issue_body)
          if not screenshots:
              screenshots = extract_val("Screenshots / Video (optional)", issue_body)
          game_settings = extract_val("Custom Game Settings (optional)", issue_body) or ""

          if not core_version:
              core_version = extract_val("Dolphin Core Version", issue_body) or "v10.5.300"

          # --- Parsing del campo unificato boot_rating ---
          boot_rating_raw = extract_val("Boot Status & Performance Rating", issue_body)
          if not boot_rating_raw:
              boot_rating_raw = extract_val("Boot Status & Performance Rating *", issue_body)

          boot = "NO"
          rating = 0
          if boot_rating_raw:
              match = re.search(r'(\d+)★', boot_rating_raw)
              if match:
                  rating = int(match.group(1))
              else:
                  nums = re.findall(r'\d+', boot_rating_raw)
                  if nums:
                      rating = int(nums[0])
              if "YES" in boot_rating_raw.upper():
                  boot = "YES"
              else:
                  boot = "NO"
          else:
              # Retrocompatibilità con vecchi template
              boot_raw = extract_val("Does the game boot?", issue_body)
              rating_raw = extract_val("Performance Rating", issue_body)
              if not rating_raw:
                  rating_raw = extract_val("Performance Rating (Stars)", issue_body)
              boot = yes_no(boot_raw)
              if rating_raw:
                  nums = re.findall(r'\d+', rating_raw)
                  rating = int(nums[0]) if nums else 3
              else:
                  rating = 3

          fps_min, fps_max = parse_fps(fps_raw)

          # ---------- Gestione Game ID ----------
          user_game_id = extract_val("Game ID (optional)", issue_body) or ""
          game_id = None
          note_missing = ""

          if user_game_id and re.match(r'[GR][A-Z0-9]{5}', user_game_id):
              game_id = user_game_id.upper()
          else:
              game_id_mapping = load_game_id_mapping()
              if game_id_mapping:
                  game_id = find_game_id(game_title, region, game_id_mapping)
              if not game_id:
                  id_match = re.search(r'[GR][A-Z0-9]{5}', issue_body)
                  if id_match:
                      game_id = id_match.group(0)
                  else:
                      # SOLO game_id viene impostato a placeholder o UNKNOWN
                      # TUTTI gli altri dati vengono salvati normalmente
                      if game_title:
                          clean = re.sub(r'[^a-zA-Z]', '', game_title)[:3].upper()
                          game_id = f"{'G' if platform == 'GameCube' else 'R'}{clean}01"
                      else:
                          game_id = "UNKNOWN"
                      note_missing = f"⚠️ Game ID not auto-detected. Using placeholder '{game_id}'."

          # ---------- Determina il file JSON di destinazione ----------
          is_wii = platform.lower() == "wii"
          json_path = "data/games2.json" if is_wii else "data/games.json"

          # ---------- Normalizza gli ID esistenti nel file ----------
          game_id_mapping = load_game_id_mapping()
          if game_id_mapping:
              print(f"🔍 Normalizing IDs in {json_path}...")
              normalize_ids(json_path, game_id_mapping)

          # ---------- Crea l'entry ----------
          new_entry = {
              "game_id": game_id,
              "game": game_title,
              "region": region,
              "rating": rating,
              "fps": fps_raw if fps_raw else "???",
              "fps_min": fps_min,
              "fps_max": fps_max,
              "boot": boot,
              "playable": "YES" if rating >= 1 else "NO",
              "core": core_profile,
              "core_version": core_version,
              "considerations": considerations + ("\n" + note_missing if note_missing else ""),
              "source": tester,
              "device": device,
              "issue": int(issue_number) if issue_number.isdigit() else 0,
              "configuration": {
                  "core_profile": core_profile,
                  "game_settings": f"{game_id}_default.ini",
                  "overclock": None,
                  "resolution": None,
              },
              "test_environment": {
                  "device": device,
                  "muos_version": muos_version,
                  "dolphin_version": core_version,
                  "sd_card": "",
              },
              "tags": [],
              "profile_recommendation": {
                  "core": core_profile,
                  "game_settings": f"{game_id}_default.ini",
                  "notes": "",
              },
              "video": {
                  "screenshot": screenshots if screenshots else "",
                  "video": "",
              },
              "variants": []
          }

          if game_settings:
              new_entry["configuration"]["game_settings_notes"] = game_settings

          # Retrocompatibilità per Wiimote Extension (solo Wii)
          wiimote_ext = extract_val("Wiimote Extension Used", issue_body)
          if is_wii and wiimote_ext:
              new_entry["wiimote_extension"] = wiimote_ext

          # ---------- Salva nel JSON ----------
          os.makedirs(os.path.dirname(json_path) if os.path.dirname(json_path) else ".", exist_ok=True)
          if os.path.exists(json_path):
              with open(json_path, "r", encoding="utf-8") as f:
                  data = json.load(f)
          else:
              data = []

          existing_idx = None
          for i, g in enumerate(data):
              if g.get("game_id") == game_id:
                  existing_idx = i
                  break

          if existing_idx is not None:
              data[existing_idx] = new_entry
              action = "updated"
          else:
              data.append(new_entry)
              action = "added"

          with open(json_path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)

          # ---------- Imposta variabili per il commit ----------
          github_env = os.environ.get('GITHUB_ENV')
          if github_env:
              with open(github_env, 'a', encoding='utf-8') as f:
                  f.write(f"ACTION={action}\n")
                  f.write(f"GAME_ID={game_id}\n")
                  f.write(f"GAME_TITLE={game_title}\n")
                  f.write(f"TARGET_ISSUE_NUM={issue_number}\n")

          print(f"✅ {game_title} ({game_id}) {action} successfully.")
          if note_missing:
              print(f"⚠️ {note_missing}")
          PYSCRIPT

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/games.json data/games2.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "auto: ${{ env.ACTION }} ${{ env.GAME_TITLE }} (${{ env.GAME_ID }}) from Issue #${{ env.TARGET_ISSUE_NUM }}"
            git push
          fi
