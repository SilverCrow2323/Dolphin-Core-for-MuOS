name: Update Dolphin Database from Issues

on:
  issues:
    types: [closed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process manually (e.g., 12)'
        required: false
        type: string

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  update-db:
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'test-report') ||
      contains(github.event.issue.labels.*.name, 'game-test') ||
      contains(github.event.issue.labels.*.name, 'wii-game-test')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Process Issue and Update JSON
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_ISSUE: ${{ inputs.issue_number }}
        run: |
          python3 << 'PYSCRIPT'
          import json, os, re, sys, subprocess
          from difflib import get_close_matches

          # ---------- Get issue body ----------
          issue_body = ""
          issue_number = ""
          if os.environ.get('MANUAL_ISSUE'):
              issue_num = os.environ.get('MANUAL_ISSUE')
              result = subprocess.run(['gh', 'issue', 'view', issue_num, '--json', 'body', '-q', '.body'],
                                      capture_output=True, text=True)
              issue_body = result.stdout
              issue_number = issue_num
          else:
              issue_body = "${{ github.event.issue.body }}"
              issue_number = "${{ github.event.issue.number }}"

          # ---------- Helper functions ----------
          def extract_val(label, body):
              """Extract a field value from issue body.
              Format: ### <label>\n<value> ... until next ### or end."""
              if not body:
                  return ""
              safe_label = re.escape(label)
              pattern = rf"###\s*{safe_label}\s*\n\s*(.*?)(?=\n###\s|\Z)"
              match = re.search(pattern, body, re.DOTALL)
              if not match:
                  return ""
              val = match.group(1).strip()
              # Clean markdown decorations
              val = re.sub(r'\*\*(.*?)\*\*', r'\1', val)
              val = re.sub(r'\*(.*?)\*', r'\1', val)
              # Remove leading list markers
              val = re.sub(r'^\s*[-\*]\s*', '', val, flags=re.MULTILINE).strip()
              if val.lower() in ["_no response_", "no response", "n/a", "none"]:
                  return ""
              return val

          def parse_fps(fps_str):
              """Parse FPS range string to (min, max). Returns (0,0) if unknown."""
              if not fps_str or fps_str == '???':
                  return (0, 0)
              nums = [int(n) for n in re.findall(r'\d+', fps_str)]
              if len(nums) >= 2:
                  return (min(nums[0], nums[1]), max(nums[0], nums[1]))
              elif len(nums) == 1:
                  return (nums[0], nums[0])
              return (0, 0)

          def yes_no(val):
              v = val.strip().lower()
              return "YES" if ("yes" in v or "true" in v) else "NO"

          # ---------- Load game ID mapping (wiitdb) ----------
          def load_game_id_mapping():
              mapping = {}
              db_path = "data/database/wiitdb.txt"
              if not os.path.exists(db_path):
                  print("⚠️ wiitdb.txt not found. Proceeding without mapping.")
                  return mapping
              with open(db_path, "r", encoding="utf-8") as f:
                  for line in f:
                      line = line.strip()
                      if not line or line.startswith('#') or line.startswith('TITLES ='):
                          continue
                      parts = line.split(' = ')
                      if len(parts) == 2:
                          game_id = parts[0].strip()
                          title = parts[1].strip()
                          if game_id[0] in ['G', 'R']:
                              mapping[title.lower()] = game_id
                              clean = re.sub(r'[^\w\s]', '', title).lower()
                              mapping[clean] = game_id
                              if title.lower().startswith('the '):
                                  mapping[title.lower()[4:]] = game_id
              return mapping

          def find_game_id(title, region, game_id_mapping):
              """Try to match game title + region to a proper Game ID."""
              if not title or not game_id_mapping:
                  return None
              clean_title = re.sub(r'[^\w\s]', '', title).strip().lower()
              clean_region = "ntsc" if "ntsc" in region.lower() else "pal"
              for mapped_title, game_id in game_id_mapping.items():
                  if clean_title in mapped_title or mapped_title in clean_title:
                      region_char = game_id[-1]
                      if clean_region == "ntsc" and region_char in ['E', 'U', 'K', 'W']:
                          return game_id
                      elif clean_region == "pal" and region_char == 'P':
                          return game_id
              matches = get_close_matches(clean_title, game_id_mapping.keys(), n=1, cutoff=0.6)
              if matches:
                  return game_id_mapping[matches[0]]
              return None

          # ---------- Extract main fields (English labels) ----------
          platform = extract_val("Platform", issue_body) or "GameCube"
          game_title = extract_val("Game Title", issue_body)
          region = extract_val("Region", issue_body) or "NTSC / USA"
          fps_raw = extract_val("FPS Range", issue_body)
          core_profile = extract_val("Core Profile Used", issue_body) or "default"
          core_version = extract_val("Dolphin Rt:Core Version", issue_body) or "v10.5.300"
          considerations = extract_val("Considerations & Notes", issue_body) or ""
          tester = extract_val("Tester Username", issue_body) or "Anonymous"
          device = extract_val("Device Used", issue_body) or "Unknown Device"
          muos_version = extract_val("muOS Version", issue_body) or "2601.1 Funky Jacaranda (current)"
          cover_art = extract_val("Cover Art URL", issue_body) or ""

          # ---------- Parse Boot Rating ----------
          boot_rating_raw = extract_val("Boot Status & Performance Rating", issue_body) or ""
          boot = "NO"
          rating = 0
          if boot_rating_raw:
              match = re.search(r'(\d+)★', boot_rating_raw)
              if match:
                  rating = int(match.group(1))
              else:
                  nums = re.findall(r'\d+', boot_rating_raw)
                  if nums:
                      rating = int(nums[0])
              if "YES" in boot_rating_raw.upper():
                  boot = "YES"
          else:
              # Backward compatibility
              boot_raw = extract_val("Does the game boot?", issue_body)
              rating_raw = extract_val("Performance Rating", issue_body)
              if not rating_raw:
                  rating_raw = extract_val("Performance Rating (Stars)", issue_body)
              boot = yes_no(boot_raw)
              if rating_raw:
                  nums = re.findall(r'\d+', rating_raw)
                  rating = int(nums[0]) if nums else 3
              else:
                  rating = 3

          # ---------- Custom Settings (optional) ----------
          recommend_cs = extract_val("Do you want to recommend Custom Settings?", issue_body) or "No"
          custom_settings = []
          if recommend_cs.strip().lower() in ["yes", "sì", "si"]:
              cs_type = extract_val("Customization Type (if Yes)", issue_body) or "Config"
              cs_details = extract_val("Configuration Details (if Yes)", issue_body) or ""
              if cs_details.strip():
                  custom_settings.append({
                      "set_type": cs_type,
                      "set_name": "Custom Setting",
                      "set_filename": "",
                      "set_url": "",
                      "set_note": cs_details
                  })

          # ---------- Attachments (optional) ----------
          attachments = []
          attachments_raw = extract_val("Attachments (URLs of screenshots/videos)", issue_body) or ""
          if attachments_raw.strip():
              for line in attachments_raw.splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  if "youtu" in line.lower() or line.lower().endswith('.mp4'):
                      media_type = "video"
                  else:
                      media_type = "image"
                  attachments.append({
                      "media_type": media_type,
                      "media_title": f"Attachment {len(attachments)+1}",
                      "media_url": line
                  })

          # ---------- Game ID ----------
          user_game_id = extract_val("Game ID", issue_body) or ""
          game_id = None
          note_missing = ""
          if user_game_id and re.match(r'[GR][A-Z0-9]{5}', user_game_id):
              game_id = user_game_id.upper()
          else:
              game_id_mapping = load_game_id_mapping()
              if game_id_mapping:
                  game_id = find_game_id(game_title, region, game_id_mapping)
              if not game_id:
                  id_match = re.search(r'[GR][A-Z0-9]{5}', issue_body)
                  if id_match:
                      game_id = id_match.group(0)
                  else:
                      if game_title:
                          clean = re.sub(r'[^a-zA-Z]', '', game_title)[:3].upper()
                          game_id = f"{'G' if platform == 'GameCube' else 'R'}{clean}01"
                      else:
                          game_id = "UNKNOWN"
                      note_missing = f"⚠️ Game ID not auto-detected. Using placeholder '{game_id}'."

          # ---------- Target JSON (unified) ----------
          json_path = "data/games_data.json"
          system = "GC" if platform.lower() == "gamecube" else "Wii"

          # Load existing data
          if os.path.exists(json_path):
              with open(json_path, "r", encoding="utf-8") as f:
                  data = json.load(f)
          else:
              data = []

          # Normalize existing IDs (optional)
          game_id_mapping = load_game_id_mapping()
          if game_id_mapping:
              for entry in data:
                  old_id = entry.get("game_info", {}).get("game_id", "")
                  if not old_id or old_id == "UNKNOWN":
                      continue
                  title = entry.get("game_info", {}).get("game", "")
                  region = entry.get("game_info", {}).get("region", "")
                  if title:
                      correct_id = find_game_id(title, region, game_id_mapping)
                      if correct_id and correct_id != old_id:
                          print(f"  🔄 {old_id} → {correct_id} ({title})")
                          entry["game_info"]["game_id"] = correct_id

          # Create new entry in grouped format
          new_entry = {
              "game_info": {
                  "game_id": game_id,
                  "system": system,
                  "game": game_title,
                  "region": region
              },
              "test_review": {
                  "rating": rating,
                  "fps": fps_raw if fps_raw else "???",
                  "boot": boot,
                  "playable": "YES" if rating >= 1 else "NO"
              },
              "test_details": {
                  "rtcore_version": core_version,
                  "core_profile": core_profile,
                  "considerations": considerations + ("\n" + note_missing if note_missing else "")
              },
              "test_environment": {
                  "tester": tester,
                  "device": device,
                  "muos_version": muos_version
              },
              "cover_art": cover_art,
              "custom_settings": custom_settings,
              "attachments": attachments
          }

          # Update or append
          existing_idx = None
          for i, g in enumerate(data):
              if g.get("game_info", {}).get("game_id") == game_id:
                  existing_idx = i
                  break

          if existing_idx is not None:
              data[existing_idx] = new_entry
              action = "updated"
          else:
              data.append(new_entry)
              action = "added"

          # Save JSON
          with open(json_path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)

          # Set environment variables for commit message
          github_env = os.environ.get('GITHUB_ENV')
          if github_env:
              with open(github_env, 'a', encoding='utf-8') as f:
                  f.write(f"ACTION={action}\n")
                  f.write(f"GAME_ID={game_id}\n")
                  f.write(f"GAME_TITLE={game_title}\n")
                  f.write(f"TARGET_ISSUE_NUM={issue_number}\n")

          print(f"✅ {game_title} ({game_id}) {action} successfully.")
          if note_missing:
              print(f"⚠️ {note_missing}")
          PYSCRIPT

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/games_data.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "auto: ${{ env.ACTION }} ${{ env.GAME_TITLE }} (${{ env.GAME_ID }}) from Issue #${{ env.TARGET_ISSUE_NUM }}"
            git push
          fi
