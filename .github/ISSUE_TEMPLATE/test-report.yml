name: "🐬 Dolphin Rt:Core Test Report"
description: "Submit test results for GameCube or Wii games on Dolphin Rt:Core / muOS"
title: "[TEST]: "
labels: ["test-report"]
body:
  - type: markdown
    attributes:
      value: |
        ---
        <div align="center">
          <img src="https://raw.githubusercontent.com/SilverCrow2323/Dolphin-Core-for-MuOS/main/assets/spdwfactory_logo.png" alt="SPDW Factory" width="120">
          <h1>DOLPHIN RT:CORE COMPATIBILITY REPORT</h1>
          <p>
            <img src="https://img.shields.io/badge/Platform-GameCube_%7C_Wii-FFA500?style=flat-square">
            <img src="https://img.shields.io/badge/Core-Dolphin_Rt:Core-blue?style=flat-square">
            <img src="https://img.shields.io/badge/OS-muOS-orange?style=flat-square">
          </p>
          <p><em>Community-driven testing database for Dolphin emulation on muOS &amp; H700 chipset</em></p>
        </div>
        ---

  # ================= SECTION 1 =================
  - type: markdown
    attributes:
      value: |
        ## <u>**1. TARGET DETAILS**</u>
        <small><em>Select the platform, enter the game title, region, and ID (if known).</em></small>

  - type: dropdown
    id: platform
    attributes:
      label: "Platform *"
      options:
        - "GameCube"
        - "Wii"
    validations:
      required: true

  - type: input
    id: game_title
    attributes:
      label: "Game Title *"
      placeholder: "e.g., Super Mario Sunshine, Wii Sports"
    validations:
      required: true

  - type: dropdown
    id: region
    attributes:
      label: "Region *"
      options:
        - "NTSC"
        - "PAL"
    validations:
      required: true

  - type: input
    id: game_id
    attributes:
      label: "Game ID (optional)"
      description: "If you know the Game ID (e.g., GMSE01, RSPE01), enter it here. Otherwise it will be auto-detected."
      placeholder: "e.g., GMSE01"
    validations:
      required: false

  - type: input
    id: cover_art
    attributes:
      label: "Cover Art URL (optional)"
      description: "If you have a direct link to a cover image, paste it here. It overrides the auto-generated cover."
      placeholder: "https://example.com/cover.jpg"
    validations:
      required: false

  # ================= SECTION 2 =================
  - type: markdown
    attributes:
      value: |
        ---
        ## <u>**2. TEST OVERVIEW**</u>
        <small><em>Rate the game's behavior: overall rating, FPS range, and core profile used.</em></small>

  - type: dropdown
    id: boot_rating
    attributes:
      label: "Boot Status & Performance Rating *"
      options:
        - "NO - 0★ (DOES NOT BOOT)"
        - "YES - 1★ (BAD - unplayable)"
        - "YES - 2★ (POOR - slow but boots)"
        - "YES - 3★ (PLAYABLE - needs tweaks)"
        - "YES - 4★ (GREAT - minor issues)"
        - "YES - 5★ (PERFECT - no issues)"
    validations:
      required: true

  - type: input
    id: fps
    attributes:
      label: "FPS Range *"
      placeholder: "e.g., 30-60, or ??? if unknown"
    validations:
      required: true

  - type: dropdown
    id: core_profile
    attributes:
      label: "Core Profile Used *"
      description: "For GameCube, use the GC profiles (first 14). For Wii, use the Wii profiles (last 4)."
      options:
        - "Default"
        - "Speedhacks"
        - "Performance"
        - "Compatibility"
        - "Lite"
        - "Troubleshooting"
        - "Widescreen"
        - "Blackscreenfix"
        - "Logger"
        - "Debug"
        - "Debug Logger"
        - "Safe"
        - "Speedup 1"
        - "Speedup 2"
        - "Wii"
        - "Wii Performance"
        - "Wii Compatibility"
        - "Wii Safe"
    validations:
      required: true

  # ================= SECTION 3 =================
  - type: markdown
    attributes:
      value: |
        ---
        ## <u>**3. RESULTS IN DEPTH**</u>
        <small><em>Describe any issues, solutions, workarounds, or detailed notes.</em></small>

  - type: textarea
    id: notes
    attributes:
      label: "Considerations & Notes"
      description: "Describe performance, graphical issues, audio problems, bugs, etc."
      placeholder: "Write your considerations here"
    validations:
      required: false

  # ================= SECTION 4 =================
  - type: markdown
    attributes:
      value: |
        ---
        ## <u>**4. ADDITIONAL DATA**</u>
        <small><em>Optional: add any recommended custom settings and/or links to screenshots/videos.</em></small>

  - type: dropdown
    id: recommend_custom_settings
    attributes:
      label: "Do you want to recommend Custom Settings?"
      options:
        - "No"
        - "Yes"
    validations:
      required: false

  - type: dropdown
    id: cs_type
    attributes:
      label: "Customization Type (if Yes)"
      options:
        - "Config"
        - "Texture"
        - "Hack"
        - "Cheats"
        - "Others"
    validations:
      required: false

  - type: textarea
    id: cs_details
    attributes:
      label: "Configuration Details (if Yes)"
      description: "Enter a brief description or the content of the configuration (e.g., Overclock=0.55, Resolution=0.33)."
      placeholder: "Overclock = 0.55\nInternalResolution = 50\nVISkip = True"
    validations:
      required: false

  - type: textarea
    id: attachments_urls
    attributes:
      label: "Attachments (URLs of screenshots/videos)"
      description: "Enter one URL per line. They will be added as attachments."
      placeholder: "https://i.imgur.com/abc123.jpg\nhttps://youtu.be/xyz789"
    validations:
      required: false

  # ================= SECTION 5 =================
  - type: markdown
    attributes:
      value: |
        ---
        ## <u>**5. TESTER INFO**</u>
        <small><em>Who performed the test, on which device, and with which muOS/Dolphin version.</em></small>

  - type: input
    id: tester
    attributes:
      label: "Tester Username *"
      placeholder: "Write your username"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: "Device Used *"
      placeholder: "e.g., RG35XX H, RG40XX H, RG CubeXX"
    validations:
      required: true

  - type: dropdown
    id: muos_version
    attributes:
      label: "muOS Version *"
      options:
        - "2601.1 Funky Jacaranda (current)"
        - "2601.0 Jacaranda"
        - "2508.4 Loose Goose"
        - "2508.3 Golden Goose"
        - "2508.2 Silly Goose"
        - "2508.1 Canada Goose"
        - "2508.0 Goose"
        - "2502.0 Pixie"
    validations:
      required: true

  - type: dropdown
    id: dolphincore_version
    attributes:
      label: "Dolphin Rt:Core Version *"
      options:
        - "v10.5.3"
        - "v10.5-124"
        - "v10.0 SPDW"
        - "v9.0"
        - "v8.0"
        - "Other (specify in notes)"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        <div align="center">
          <br>
          <img src="https://raw.githubusercontent.com/SilverCrow2323/Dolphin-Core-for-MuOS/main/assets/gamecube.svg" alt="Console" width="48">
          <br><br>
          <strong>Thank you for contributing!</strong> 🙌
          <br><br>
          <small>Your report will be automatically processed and added to the database.</small>
        </div>
