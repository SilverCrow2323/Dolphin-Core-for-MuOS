name: "🧪 New GameCube Game Test"
description: "Submit test results for a new GameCube game on Dolphin Rt:Core / muOS"
title: "[TEST GC]: "
labels: ["game-test", "gamecube"]
body:
  - type: markdown
    attributes:
      value: |
        ---
        <div align="center">
          <img src="https://raw.githubusercontent.com/SilverCrow2323/Dolphin-Core-for-MuOS/main/assets/spdwfactory_logo.png" alt="SPDW Factory" width="120">
          <h1>🎮 GAMECUBE COMPATIBILITY REPORT</h1>
          <p>
            <img src="https://img.shields.io/badge/Platform-GameCube-FFA500?style=flat-square">
            <img src="https://img.shields.io/badge/Core-Dolphin_Rt:Core-blue?style=flat-square">
            <img src="https://img.shields.io/badge/OS-muOS-orange?style=flat-square">
          </p>
          <p><em>Community-driven testing database for Dolphin emulation on muOS &amp; H700 chipset</em></p>
          <br>
          <strong>⚠️ Before submitting</strong><br>
          Please check if this game has already been reported in the 
          <a href="https://github.com/your-repo/issues?q=is%3Aissue+label%3Agame-test">database</a>.
        </div>
        ---

        ## 🔍 Game ID Autodetection

        | Step | Action |
        |------|--------|
        | 1️⃣ | Start typing the game title in the field below |
        | 2️⃣ | Wait a few seconds – the ID will appear automatically |
        | 3️⃣ | If auto-detection fails, search manually on [GameTDB](https://www.gametdb.com/GameCube/) |

        ---

  - type: input
    id: game_title
    attributes:
      label: "📖 Game Title *"
      description: "Start typing the game title. Autocomplete will help you!"
      placeholder: "e.g., Luigi's Mansion, Super Mario Sunshine, Metroid Prime"
    validations:
      required: true

  - type: input
    id: game_id_display
    attributes:
      label: "🎯 Game ID (Auto-detected) *"
      description: "This will be automatically filled when you type the title above"
      placeholder: "GLME01, GMSE01, etc."
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        <div align="center">
          <h3>🖼️ Cover Art Preview</h3>
          <p><em>If the Game ID was detected correctly, the cover will appear in the web dashboard.</em></p>
          <p>🔗 <a href="https://www.gametdb.com/GameCube/{GAME_ID}">View cover on GameTDB</a></p>
          <p><small>⚠️ Replace <code>{GAME_ID}</code> with the actual Game ID above if the link doesn't work.</small></p>
        </div>
        ---

  - type: markdown
    attributes:
      value: |
        ## 📊 Test Results

        | Field | Description |
        |-------|-------------|
        | **Region** | Select the region of your game disc/ROM |
        | **Performance** | 5★ = perfect, 0★ = does not boot |
        | **FPS Range** | Min and max FPS observed |
        | **Boot Status** | Does the game start? |
        | **Playable** | Can you play through the game? |
        | **Core Profile** | Which core profile was used? |

        ---

  - type: dropdown
    id: region
    attributes:
      label: "🌍 Region *"
      options:
        - "NTSC / USA"
        - "PAL"
        - "NTSC / JPN"
        - "NTSC / KOR"
    validations:
      required: true

  - type: dropdown
    id: rating
    attributes:
      label: "⭐ Performance Rating *"
      description: "5★ = virtually perfect. 0★ = does not boot at all."
      options:
        - "5 - PERFECT (no issues)"
        - "4 - GREAT (minor issues)"
        - "3 - PLAYABLE (needs tweaks)"
        - "2 - POOR (slow but boots)"
        - "1 - BAD (unplayable)"
        - "0 - DOES NOT BOOT"
    validations:
      required: true

  - type: input
    id: fps
    attributes:
      label: "🎬 FPS Range *"
      description: "Min and max FPS observed (e.g., 30-60). Use `???` if unknown."
      placeholder: "e.g., 30-60"
    validations:
      required: true

  - type: dropdown
    id: boot
    attributes:
      label: "🔌 Does the game boot? *"
      options:
        - "YES"
        - "NO"
    validations:
      required: true

  - type: dropdown
    id: playable
    attributes:
      label: "🎮 Is the game playable? *"
      description: "Can you actually play through the game, even with issues?"
      options:
        - "YES"
        - "NO"
    validations:
      required: true

  - type: dropdown
    id: core_profile
    attributes:
      label: "⚙️ Core Profile Used *"
      options:
        - "Standard"
        - "Performance"
        - "Compatibility"
        - "Wii"
        - "Other (specify in notes)"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ## 🛠️ Advanced Configuration

        | Setting | Description |
        |---------|-------------|
        | **GameSettings** | Paste custom configuration or describe key changes |
        | **Notes** | Performance, graphical issues, audio problems, workarounds |
        | **Screenshots/Video** | Links to Imgur, YouTube, or other hosting |

        ---

  - type: textarea
    id: game_settings_used
    attributes:
      label: "📝 GameSettings Configuration"
      description: "If you used a custom GameSettings file, paste its content or describe the key changes."
      placeholder: "Overclock = 0.55, InternalResolution = 50, VISkip = True, etc."
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: "📝 Considerations & Notes"
      description: "Describe performance, graphical issues, audio problems, workarounds, or anything noteworthy."
      placeholder: "Write your considerations, notes or performance details here"
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: "🖼️ Screenshots / Video (optional)"
      description: "Paste links to Imgur, YouTube, or other hosting services."
      placeholder: "https://i.imgur.com/abc123.jpg"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        ## 👤 Tester Information

        | Field | Description |
        |-------|-------------|
        | **Username** | Your alias for credit in the database |
        | **Device** | Which device did you test on? |
        | **muOS Version** | Which version of muOS are you running? |
        | **Dolphin Core** | Which Dolphin core version? |

        ---

  - type: input
    id: tester
    attributes:
      label: "👤 Tester Username *"
      description: "Your username or alias to credit in the database."
      placeholder: "Write your username"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: "📱 Device Used *"
      description: "Which device did you test on?"
      placeholder: "e.g., RG35XX H"
    validations:
      required: true

  - type: input
    id: muos_version
    attributes:
      label: "💾 muOS Version *"
      description: "Which version of muOS are you running?"
      placeholder: "e.g., Jacaranda"
    validations:
      required: true

  - type: dropdown
    id: dolphincore_version
    attributes:
      label: "🐬 Dolphin Core Version *"
      options:
        - "v10.5.300"
        - "v10.5-124"
        - "v10.0 SPDW"
        - "v9.0"
        - "v8.0"
        - "Other (specify in notes)"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        <div align="center">
          <br>
          <img src="https://raw.githubusercontent.com/SilverCrow2323/Dolphin-Core-for-MuOS/main/assets/gamecube.svg" alt="GameCube" width="48">
          <br><br>
          <strong>Thank you for contributing to the Dolphin Rt:Core compatibility database!</strong> 🙌
          <br><br>
          <small>🔄 This report will be automatically processed and added to the database.</small>
        </div>
