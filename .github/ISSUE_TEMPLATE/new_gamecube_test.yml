name: "🧪 New GameCube Game Test"
description: "Submit test results for a new game on Dolphin Core / muOS"
title: "[TEST]: "
labels: ["game-test"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for contributing to the compatibility database! Please fill out the fields below.

  - type: input
    id: title
    attributes:
      label: "Game Title"
      description: "Exact name of the game (e.g., Super Smash Bros. Melee)"
      placeholder: "Super Mario Sunshine"
    validations:
      required: true

  - type: dropdown
    id: region
    attributes:
      label: "Region"
      options:
        - "PAL"
        - "NTSC"
        - "JPN"
    validations:
      required: true

  - type: dropdown
    id: stars
    attributes:
      label: "Rating (Stars)"
      options:
        - "5 - Perfect!"
        - "4 - Playable with issues"
        - "3 - Inconsistent"
        - "2 - Disaster but tries"
        - "1 - Better not"
        - "0 - Doesn't boot"
    validations:
      required: true

  - type: input
    id: fps
    attributes:
      label: "Average FPS"
      placeholder: "50"
    validations:
      required: true

  - type: dropdown
    id: boots
    attributes:
      label: "Does the game boot?"
      options:
        - "Yes"
        - "No"
    validations:
      required: true

  - type: dropdown
    id: playable
    attributes:
      label: "Is the game playable?"
      options:
        - "Yes"
        - "No"
    validations:
      required: true

  - type: dropdown
    id: settings
    attributes:
      label: "Core Profile Used"
      options:
        - "Default"
        - "Speed Hack"
        - "Black Screen Fix"
    validations:
      required: true

  - type: dropdown
    id: core_version
    attributes:
      label: "Core Version"
      description: "Select the version of the core used for this test"
      options:
        - "~v8.0"
        - "v9.0"
        - "v9.0 Goose"
        - "v10.0 SPDW"
        - "v10.5-124"
        - "v10.5-3"
        - "Other (specify in notes)"
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: "Considerations & Notes"
      placeholder: "Runs smooth at 50fps but drops frames in crowded areas..."
    validations:
      required: false

  - type: input
    id: tester
    attributes:
      label: "Your Device"
      placeholder: "your_device"
    validations:
      required: true
