name: "🐬 Dolphin Rt:Core Test Report"
description: "Submit test results for GameCube or Wii games on Dolphin Rt:Core / muOS"
title: "[TEST]: "
labels: ["test-report"]
body:
  - type: markdown
    attributes:
      value: |
        ---
        <div align="center">
          <img src="https://raw.githubusercontent.com/SilverCrow2323/Dolphin-Core-for-MuOS/main/assets/spdwfactory_logo.png" alt="SPDW Factory" width="120">
          <h1>🎮 DOLPHIN RT:CORE COMPATIBILITY REPORT</h1>
          <p>
            <img src="https://img.shields.io/badge/Platform-GameCube_%7C_Wii-FFA500?style=flat-square">
            <img src="https://img.shields.io/badge/Core-Dolphin_Rt:Core-blue?style=flat-square">
            <img src="https://img.shields.io/badge/OS-muOS-orange?style=flat-square">
          </p>
          <p><em>Community-driven testing database for Dolphin emulation on muOS &amp; H700 chipset</em></p>
        </div>
        ---

  - type: markdown
    attributes:
      value: |
        ## 🎯 Target Details

        | Field | Value |
        |-------|-------|
        | **Platform** | *(select below)* |
        | **Game Title** | *(enter below)* |
        | **Region** | *(select below)* |
        | **Game ID** | *(auto-detected or enter manually)* |

        ---

  - type: dropdown
    id: platform
    attributes:
      label: "🎮 Platform *"
      options:
        - "GameCube"
        - "Wii"
    validations:
      required: true

  - type: input
    id: game_title
    attributes:
      label: "📖 Game Title *"
      placeholder: "e.g., Super Mario Sunshine, Wii Sports"
    validations:
      required: true

  - type: dropdown
    id: region
    attributes:
      label: "🌍 Region *"
      options:
        - "NTSC / USA"
        - "PAL"
        - "NTSC / JPN"
        - "NTSC / KOR"
    validations:
      required: true

  - type: input
    id: game_id
    attributes:
      label: "🎯 Game ID (optional)"
      description: "If you already know the Game ID (e.g., GMSE01, RSPE01), enter it here. Otherwise it will be auto-detected."
      placeholder: "e.g., GMSE01"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        ## 📊 Test Overview

        **🔌 Boot** – Does the game start? *(select below)*  
        **🎮 Playable** – Can you play through the game? *(select below)*  
        **🎬 FPS Range** – Min / max observed *(enter below)*  

        **⭐ Performance Rating**

        | Rating | Description |
        |--------|-------------|
        |  0★ | DOES NOT BOOT |
        | ⭐ 1★ | BAD (unplayable) |
        | ⭐⭐ 2★ | POOR (slow but boots) |
        | ⭐⭐⭐ 3★ | PLAYABLE (needs tweaks) |
        | ⭐⭐⭐⭐ 4★ | GREAT (minor issues) |
        | ⭐⭐⭐⭐⭐ 5★ | PERFECT (no issues) |

        ---

  - type: dropdown
    id: boot
    attributes:
      label: "🔌 Does the game boot? *"
      options:
        - "YES"
        - "NO"
    validations:
      required: true

  - type: dropdown
    id: playable
    attributes:
      label: "🎮 Is the game playable? *"
      options:
        - "YES"
        - "NO"
    validations:
      required: true

  - type: input
    id: fps
    attributes:
      label: "🎬 FPS Range *"
      placeholder: "e.g., 30-60, or ??? if unknown"
    validations:
      required: true

  - type: dropdown
    id: rating
    attributes:
      label: "⭐ Performance Rating *"
      description: "Select the rating that best matches the game's performance."
      options:
        - "5 - PERFECT (no issues)"
        - "4 - GREAT (minor issues)"
        - "3 - PLAYABLE (needs tweaks)"
        - "2 - POOR (slow but boots)"
        - "1 - BAD (unplayable)"
        - "0 - DOES NOT BOOT"
    validations:
      required: true

  - type: dropdown
    id: core_profile
    attributes:
      label: "⚙️ Core Profile Used *"
      description: "Select the Rt:Core profile you tested with."
      options:
        - "default"
        - "performance"
        - "compatibility"
        - "troubleshooting"
        - "lite"
        - "widescreen"
        - "debug / logger"
        - "blackscreenfix"
        - "speedup 1"
        - "speedup 2"
        - "wii-performance"
        - "wii-compatibility"
        - "wii-safe"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ## 📝 Additional Observations & Attachments

        **📝 Considerations & Notes** – write below  
        **⚙️ Custom Game Settings** – if used, describe below  
        **🖼️ Screenshots / Video** – paste links below if available  

        ---

  - type: textarea
    id: notes
    attributes:
      label: "📝 Considerations & Notes"
      description: "Describe performance, graphical issues, audio problems, workarounds, or anything noteworthy."
      placeholder: "Write your considerations, notes or performance details here"
    validations:
      required: false

  - type: textarea
    id: game_settings_used
    attributes:
      label: "⚙️ Custom Game Settings (optional)"
      description: "If you used custom GameSettings (e.g., overclock, resolution tweaks), paste your configuration here."
      placeholder: "Overclock = 0.55\nInternalResolution = 50\nVISkip = True"
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: "🖼️ Screenshots / Video Links (optional)"
      description: "Paste links to Imgur, YouTube, or other hosting services."
      placeholder: "https://i.imgur.com/abc123.jpg\nhttps://youtu.be/xyz789"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        ## 👤 Tester Information

  - type: input
    id: tester
    attributes:
      label: "👤 Tester Username *"
      description: "Your username or alias to credit in the database."
      placeholder: "Write your username"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: "📱 Device Used *"
      description: "Which device did you test on?"
      placeholder: "e.g., RG35XX H, RG40XX H, RG CubeXX"
    validations:
      required: true

  - type: dropdown
    id: muos_version
    attributes:
      label: "💾 muOS Version *"
      description: "Select the version of muOS you are running."
      options:
        - "2601.1 Funky Jacaranda (current)"
        - "2601.0 Jacaranda"
        - "2508.4 Loose Goose"
        - "2508.3 Golden Goose"
        - "2508.2 Silly Goose"
        - "2508.1 Canada Goose"
        - "2508.0 Goose"
        - "2502.0 Pixie"
    validations:
      required: true

  - type: dropdown
    id: dolphincore_version
    attributes:
      label: "🐬 Dolphin Rt:Core Version *"
      description: "Select the Dolphin Rt:Core version you used."
      options:
        - "v10.5.3"
        - "v10.5-124"
        - "v10.0 SPDW"
        - "v9.0"
        - "v8.0"
        - "Other (specify in notes)"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        <div align="center">
          <br>
          <img src="https://raw.githubusercontent.com/SilverCrow2323/Dolphin-Core-for-MuOS/main/assets/gamecube.svg" alt="Console" width="48">
          <br><br>
          <strong>Thank you for contributing to the Dolphin Rt:Core compatibility database!</strong> 🙌
          <br><br>
          <small>🔄 This report will be automatically processed and added to the database.</small>
        </div>
