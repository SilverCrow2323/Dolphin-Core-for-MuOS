name: "🐬 Dolphin Rt:Core Test Report"
description: "Submit test results for GameCube or Wii games on Dolphin Rt:Core / muOS"
title: "[TEST]: "
labels: ["test-report"]
body:
  - type: markdown
    attributes:
      value: |
        ---
        <div align="center">
          <img src="https://raw.githubusercontent.com/SilverCrow2323/Dolphin-Core-for-MuOS/main/assets/spdwfactory_logo.png" alt="SPDW Factory" width="120">
          <h1>🎮 DOLPHIN RT:CORE COMPATIBILITY REPORT</h1>
          <p>
            <img src="https://img.shields.io/badge/Platform-GameCube_%7C_Wii-FFA500?style=flat-square">
            <img src="https://img.shields.io/badge/Core-Dolphin_Rt:Core-blue?style=flat-square">
            <img src="https://img.shields.io/badge/OS-muOS-orange?style=flat-square">
          </p>
          <p><em>Community-driven testing database for Dolphin emulation on muOS &amp; H700 chipset</em></p>
        </div>
        ---

  - type: markdown
    attributes:
      value: |
        ## 🎯 Target Details

        | Field | Value |
        |-------|-------|
        | **Platform** | *(select below)* |
        | **Game Title** | *(enter below)* |
        | **Region** | *(select below)* |
        | **Game ID** | *(auto-detected or enter manually)* |

        ---

  - type: dropdown
    id: platform
    attributes:
      label: "🎮 Platform *"
      options:
        - "GameCube"
        - "Wii"
    validations:
      required: true

  - type: input
    id: game_title
    attributes:
      label: "📖 Game Title *"
      placeholder: "e.g., Super Mario Sunshine, Wii Sports"
    validations:
      required: true

  - type: dropdown
    id: region
    attributes:
      label: "🌍 Region *"
      options:
        - "NTSC / USA"
        - "PAL"
        - "NTSC / JPN"
        - "NTSC / KOR"
    validations:
      required: true

  - type: input
    id: game_id
    attributes:
      label: "🎯 Game ID (optional)"
      description: "If you already know the Game ID (e.g., GMSE01, RSPE01), enter it here. Otherwise it will be auto-detected."
      placeholder: "e.g., GMSE01"
    validations:
      required: false

  - type: input
    id: cover_art
    attributes:
      label: "🖼️ Cover Art URL (optional)"
      description: "If you have a direct link to a cover image (e.g., Imgur, GameTDB), paste it here. It will override the auto-generated cover based on Game ID."
      placeholder: "https://example.com/cover.jpg"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        ## 📊 Test Overview

        **🔌 Boot & Performance Rating** – select the option that matches both the boot status and the overall performance.

        | Selection | Meaning |
        |-----------|---------|
        | NO - 0★ | Game does not boot at all |
        | YES - 1★ | Boots but is unplayable |
        | YES - 2★ | Boots, slow but playable with patience |
        | YES - 3★ | Playable, needs tweaks |
        | YES - 4★ | Great, minor issues only |
        | YES - 5★ | Perfect, no issues |

        **🎬 FPS Range** – enter the min and max FPS observed.

        ---

  - type: dropdown
    id: boot_rating
    attributes:
      label: "🔌 Boot Status & Performance Rating *"
      description: "Select the option that describes both boot and performance."
      options:
        - "NO - 0★ (DOES NOT BOOT)"
        - "YES - 1★ (BAD - unplayable)"
        - "YES - 2★ (POOR - slow but boots)"
        - "YES - 3★ (PLAYABLE - needs tweaks)"
        - "YES - 4★ (GREAT - minor issues)"
        - "YES - 5★ (PERFECT - no issues)"
    validations:
      required: true

  - type: input
    id: fps
    attributes:
      label: "🎬 FPS Range *"
      placeholder: "e.g., 30-60, or ??? if unknown"
    validations:
      required: true

  - type: dropdown
    id: core_profile
    attributes:
      label: "⚙️ Core Profile Used *"
      description: "Select the Rt:Core profile you tested with."
      options:
        - "default"
        - "performance"
        - "compatibility"
        - "troubleshooting"
        - "lite"
        - "widescreen"
        - "debug / logger"
        - "blackscreenfix"
        - "speedup 1"
        - "speedup 2"
        - "wii-performance"
        - "wii-compatibility"
        - "wii-safe"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ## 📝 Additional Observations & Attachments

        **📝 Considerations & Notes** – write below  
        **⚙️ Custom Game Settings** – if used, describe below (one per line, pipe-separated)  
        **🖼️ Screenshots / Video** – paste links below if available (one per line, pipe-separated)  

        ---

  - type: textarea
    id: notes
    attributes:
      label: "📝 Considerations & Notes"
      description: "Describe performance, graphical issues, audio problems, workarounds, or anything noteworthy."
      placeholder: "Write your considerations, notes or performance details here"
    validations:
      required: false

  - type: textarea
    id: custom_settings
    attributes:
      label: "⚙️ Custom Settings (optional)"
      description: "Paste one custom setting per line in this format: `type|name|filename|url|notes`. type must be one of: Game Setting, Texture Mod, Hack, Cheats, Other. Example:\n`Game Setting|Overclock tweak|GMSE01.ini|https://...|Overclock=0.55`"
      placeholder: "Game Setting|Overclock tweak|GMSE01.ini|https://...|Overclock=0.55\nTexture Mod|HD Texture|GMS_1080.zip|https://...|Visual upgrade"
    validations:
      required: false

  - type: textarea
    id: attachments
    attributes:
      label: "🖼️ Attachments (Screenshots / Video) (optional)"
      description: "Paste one attachment per line in this format: `image|Title|URL` or `video|Title|URL`."
      placeholder: "image|Screenshot 1|https://i.imgur.com/abc123.jpg\nvideo|Gameplay|https://youtu.be/xyz789"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        ## 👤 Tester Information

  - type: input
    id: tester
    attributes:
      label: "👤 Tester Username *"
      description: "Your username or alias to credit in the database."
      placeholder: "Write your username"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: "📱 Device Used *"
      description: "Which device did you test on?"
      placeholder: "e.g., RG35XX H, RG40XX H, RG CubeXX"
    validations:
      required: true

  - type: dropdown
    id: muos_version
    attributes:
      label: "💾 muOS Version *"
      description: "Select the version of muOS you are running."
      options:
        - "2601.1 Funky Jacaranda (current)"
        - "2601.0 Jacaranda"
        - "2508.4 Loose Goose"
        - "2508.3 Golden Goose"
        - "2508.2 Silly Goose"
        - "2508.1 Canada Goose"
        - "2508.0 Goose"
        - "2502.0 Pixie"
    validations:
      required: true

  - type: dropdown
    id: dolphincore_version
    attributes:
      label: "🐬 Dolphin Rt:Core Version *"
      description: "Select the Dolphin Rt:Core version you used."
      options:
        - "v10.5.3"
        - "v10.5-124"
        - "v10.0 SPDW"
        - "v9.0"
        - "v8.0"
        - "Other (specify in notes)"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        <div align="center">
          <br>
          <img src="https://raw.githubusercontent.com/SilverCrow2323/Dolphin-Core-for-MuOS/main/assets/gamecube.svg" alt="Console" width="48">
          <br><br>
          <strong>Thank you for contributing to the Dolphin Rt:Core compatibility database!</strong> 🙌
          <br><br>
          <small>🔄 This report will be automatically processed and added to the database.</small>
        </div>
