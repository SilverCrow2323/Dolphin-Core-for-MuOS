name: "🐬 Dolphin Rt:Core Test Report"
description: "Submit test results for GameCube or Wii games on Dolphin Rt:Core / muOS"
title: "[TEST]: "
labels: ["test-report"]
body:
  - type: markdown
    attributes:
      value: |
        ---
        <div align="center">
          <img src="https://raw.githubusercontent.com/SilverCrow2323/Dolphin-Core-for-MuOS/main/assets/spdwfactory_logo.png" alt="SPDW Factory" width="120">
          <h1>🎮 DOLPHIN RT:CORE COMPATIBILITY REPORT</h1>
          <p>
            <img src="https://img.shields.io/badge/Platform-GameCube_%7C_Wii-FFA500?style=flat-square">
            <img src="https://img.shields.io/badge/Core-Dolphin_Rt:Core-blue?style=flat-square">
            <img src="https://img.shields.io/badge/OS-muOS-orange?style=flat-square">
          </p>
          <p><em>Community-driven testing database for Dolphin emulation on muOS &amp; H700 chipset</em></p>
        </div>
        ---

  - type: markdown
    attributes:
      value: |
        ## 🎯 Target Details

        | Field | Value |
        |-------|-------|
        | **Platform** | *(select below)* |
        | **Game Title** | *(enter below)* |
        | **Region** | *(select below)* |
        | **Game ID** | *(auto-detected or enter manually)* |

        ---

  - type: dropdown
    id: platform
    attributes:
      label: "🎮 Platform *"
      options:
        - "GameCube"
        - "Wii"
    validations:
      required: true

  - type: input
    id: game_title
    attributes:
      label: "📖 Game Title *"
      placeholder: "e.g., Super Mario Sunshine, Wii Sports"
    validations:
      required: true

  - type: dropdown
    id: region
    attributes:
      label: "🌍 Region *"
      options:
        - "NTSC / USA"
        - "PAL"
        - "NTSC / JPN"
        - "NTSC / KOR"
    validations:
      required: true

  - type: input
    id: game_id
    attributes:
      label: "🎯 Game ID (optional)"
      description: "If you already know the Game ID (e.g., GMSE01, RSPE01), enter it here. Otherwise it will be auto-detected."
      placeholder: "e.g., GMSE01"
    validations:
      required: false

  - type: input
    id: cover_art
    attributes:
      label: "🖼️ Cover Art URL (optional)"
      description: "If you have a direct link to a cover image, paste it here. It overrides the auto-generated cover."
      placeholder: "https://example.com/cover.jpg"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        ## 📊 Test Overview

        **🔌 Boot & Performance Rating** – select the option that matches both boot and performance.

        | Selection | Meaning |
        |-----------|---------|
        | NO - 0★ | Game does not boot |
        | YES - 1★ | Boots but unplayable |
        | YES - 2★ | Boots, slow but playable |
        | YES - 3★ | Playable, needs tweaks |
        | YES - 4★ | Great, minor issues |
        | YES - 5★ | Perfect, no issues |

        **🎬 FPS Range** – enter the min and max FPS.

        ---

  - type: dropdown
    id: boot_rating
    attributes:
      label: "🔌 Boot Status & Performance Rating *"
      options:
        - "NO - 0★ (DOES NOT BOOT)"
        - "YES - 1★ (BAD - unplayable)"
        - "YES - 2★ (POOR - slow but boots)"
        - "YES - 3★ (PLAYABLE - needs tweaks)"
        - "YES - 4★ (GREAT - minor issues)"
        - "YES - 5★ (PERFECT - no issues)"
    validations:
      required: true

  - type: input
    id: fps
    attributes:
      label: "🎬 FPS Range *"
      placeholder: "e.g., 30-60, or ??? if unknown"
    validations:
      required: true

  - type: dropdown
    id: core_profile
    attributes:
      label: "⚙️ Core Profile Used *"
      options:
        - "default"
        - "performance"
        - "compatibility"
        - "troubleshooting"
        - "lite"
        - "widescreen"
        - "debug / logger"
        - "blackscreenfix"
        - "speedup 1"
        - "speedup 2"
        - "wii-performance"
        - "wii-compatibility"
        - "wii-safe"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ## 📝 Additional Observations

  - type: textarea
    id: notes
    attributes:
      label: "📝 Considerations & Notes"
      description: "Describe performance, graphical issues, audio problems, workarounds, anything noteworthy."
      placeholder: "Write your considerations here"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        ## ⚙️ Custom Settings (optional – fill as many as needed, leave empty for unused)

        *Each custom setting can be added by filling the fields below. If you don't need a setting, leave all its fields empty.*

  - type: dropdown
    id: cs1_type
    attributes:
      label: "Custom Settings 1 – Type"
      options:
        - "Game Setting"
        - "Texture Mod"
        - "Hack"
        - "Cheats"
        - "Other"
    validations:
      required: false

  - type: input
    id: cs1_title
    attributes:
      label: "Custom Settings 1 – Subject / Title"
      placeholder: "e.g., Overclock tweak, HD Texture Pack"
    validations:
      required: false

  - type: input
    id: cs1_url
    attributes:
      label: "Custom Settings 1 – Download Link"
      placeholder: "https://..."
    validations:
      required: false

  - type: textarea
    id: cs1_notes
    attributes:
      label: "Custom Settings 1 – Additional Notes"
      placeholder: "e.g., Overclock=0.55, Resolution=0.33"
    validations:
      required: false

  - type: dropdown
    id: cs2_type
    attributes:
      label: "Custom Settings 2 – Type"
      options:
        - "Game Setting"
        - "Texture Mod"
        - "Hack"
        - "Cheats"
        - "Other"
    validations:
      required: false

  - type: input
    id: cs2_title
    attributes:
      label: "Custom Settings 2 – Subject / Title"
      placeholder: "e.g., Shader fix, Cheat code"
    validations:
      required: false

  - type: input
    id: cs2_url
    attributes:
      label: "Custom Settings 2 – Download Link"
      placeholder: "https://..."
    validations:
      required: false

  - type: textarea
    id: cs2_notes
    attributes:
      label: "Custom Settings 2 – Additional Notes"
      placeholder: "e.g., Improve water effects"
    validations:
      required: false

  - type: dropdown
    id: cs3_type
    attributes:
      label: "Custom Settings 3 – Type"
      options:
        - "Game Setting"
        - "Texture Mod"
        - "Hack"
        - "Cheats"
        - "Other"
    validations:
      required: false

  - type: input
    id: cs3_title
    attributes:
      label: "Custom Settings 3 – Subject / Title"
      placeholder: "e.g., Controller config"
    validations:
      required: false

  - type: input
    id: cs3_url
    attributes:
      label: "Custom Settings 3 – Download Link"
      placeholder: "https://..."
    validations:
      required: false

  - type: textarea
    id: cs3_notes
    attributes:
      label: "Custom Settings 3 – Additional Notes"
      placeholder: "e.g., Fix audio stuttering"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        ## 🖼️ Attachments (optional – fill as many as needed, leave empty for unused)

  - type: dropdown
    id: att1_type
    attributes:
      label: "Attachment 1 – Type"
      options:
        - "image"
        - "video"
    validations:
      required: false

  - type: input
    id: att1_title
    attributes:
      label: "Attachment 1 – Title"
      placeholder: "e.g., Screenshot 1"
    validations:
      required: false

  - type: input
    id: att1_url
    attributes:
      label: "Attachment 1 – URL"
      placeholder: "https://..."
    validations:
      required: false

  - type: dropdown
    id: att2_type
    attributes:
      label: "Attachment 2 – Type"
      options:
        - "image"
        - "video"
    validations:
      required: false

  - type: input
    id: att2_title
    attributes:
      label: "Attachment 2 – Title"
      placeholder: "e.g., Gameplay video"
    validations:
      required: false

  - type: input
    id: att2_url
    attributes:
      label: "Attachment 2 – URL"
      placeholder: "https://..."
    validations:
      required: false

  - type: dropdown
    id: att3_type
    attributes:
      label: "Attachment 3 – Type"
      options:
        - "image"
        - "video"
    validations:
      required: false

  - type: input
    id: att3_title
    attributes:
      label: "Attachment 3 – Title"
      placeholder: "e.g., Screenshot 2"
    validations:
      required: false

  - type: input
    id: att3_url
    attributes:
      label: "Attachment 3 – URL"
      placeholder: "https://..."
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        ## 👤 Tester Information

  - type: input
    id: tester
    attributes:
      label: "👤 Tester Username *"
      placeholder: "Write your username"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: "📱 Device Used *"
      placeholder: "e.g., RG35XX H, RG40XX H, RG CubeXX"
    validations:
      required: true

  - type: dropdown
    id: muos_version
    attributes:
      label: "💾 muOS Version *"
      options:
        - "2601.1 Funky Jacaranda (current)"
        - "2601.0 Jacaranda"
        - "2508.4 Loose Goose"
        - "2508.3 Golden Goose"
        - "2508.2 Silly Goose"
        - "2508.1 Canada Goose"
        - "2508.0 Goose"
        - "2502.0 Pixie"
    validations:
      required: true

  - type: dropdown
    id: dolphincore_version
    attributes:
      label: "🐬 Dolphin Rt:Core Version *"
      options:
        - "v10.5.3"
        - "v10.5-124"
        - "v10.0 SPDW"
        - "v9.0"
        - "v8.0"
        - "Other (specify in notes)"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        <div align="center">
          <br>
          <img src="https://raw.githubusercontent.com/SilverCrow2323/Dolphin-Core-for-MuOS/main/assets/gamecube.svg" alt="Console" width="48">
          <br><br>
          <strong>Thank you for contributing!</strong> 🙌
          <br><br>
          <small>Your report will be automatically processed and added to the database.</small>
        </div>
