# Dolphin Rt:Core - Hotkeys.ini
# MANCAVA DEL TUTTO a livello sistema (opt/.../Config): e' l'intero motivo
# per cui gli hotkey non funzionavano. Non serviva nessuna intestazione
# esotica, il file semplicemente non esisteva su questo percorso: senza
# "Device = SDL/0/muOS-Keys" (identica a GCPadNew.ini) Dolphin non sa
# nemmeno su quale device ascoltare.
#
# Scelta di design: qui sotto i bind sono TUTTI diretti al joystick
# (`Button N` & `Button M`), NON tastiera. Cosi' non serve nessuna
# traduzione via gptokeyb per salvare/caricare/reset: una cosa in meno
# che puo' rompersi. gptokeyb/ext-dolphin.gptk resta comunque abbinato
# al lancio (vedi quel file) ma solo per il tasto MENU, che apre il
# Live Menu in un processo separato e quello si' deve passare da li'.
#
# Numerazione bottoni verificata per Dolphin (Device SDL/0/muOS-Keys):
# 0=B 1=A 2=X 3=Y 4=L-trigger 5=R-trigger 6=SELECT 7=START 8=MENU/HOME
# 9=L1 10=screenshot-combo(vedi sotto) 11=Z 12=R1
# Riferimento completo in BUTTON_MAP_REFERENCE.md nella root del pacchetto.
[Hotkeys1]
Device = SDL/0/muOS-Keys
Keys/Exit = (`Button 6` & `Button 9` & `Button 12`)
Keys/Toggle Pause = (`Button 6` & `Button 1`)
Keys/Reset = (`Button 7` & `Button 12`)
Keys/Save State Slot 1 = (`Button 6` & `Button 0`)
Keys/Save State Slot 2 = (`Button 6` & `Button 2`)
Keys/Save State Slot 3 = (`Button 6` & `Button 3`)
Keys/Load State Slot 1 = (`Button 7` & `Button 1`)
Keys/Load State Slot 2 = (`Button 7` & `Button 0`)
Keys/Load State Slot 3 = (`Button 7` & `Button 2`)
Keys/Load State Slot 4 = (`Button 7` & `Button 3`)
Keys/Take Screenshot = (`Button 9` & `Button 1`)
Keys/Toggle Fullscreen = (`Button 6` & `Button 12`)
Keys/Volume Down = `Button 1`
Keys/Volume Up = `Button 2`
# NOTA - da verificare su hardware: le combo sopra usano 6/7 come SELECT/
# START "modificatori". Se in gioco capita un salvataggio o un reset
# involontario, e' segno che uno di quei bottoni non e' quello che penso:
# dimmi esattamente quale combo scatta da sola e la correggo.
