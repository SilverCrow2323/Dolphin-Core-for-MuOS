# Dolphin Rt:Core - WiimoteNew.ini (default = variante 2 joystick analogici)
# Stessa numerazione verificata di GCPadNew.ini (vedi BUTTON_MAP_REFERENCE.md).
# D-Pad ruotato di proposito: il Wiimote si tiene "di lato" per i giochi
# classici, quindi Up/Down/Left/Right fisici vengono ruotati di 90 gradi
# per corrispondere all'orientamento reale del Wiimote virtuale.
[Wiimote1]
Device = SDL/0/muOS-Keys
Buttons/A = `Button 1`
Buttons/B = `Button 0`
Buttons/1 = `Button 2`
Buttons/2 = `Button 3`
Buttons/- = (`Button 6` & !`Button 7` )
Buttons/+ = (`Button 7` & !`Button 6` )
Buttons/Home = `Button 8`
# --- Stick destro = puntatore IR (simula il puntamento al centro schermo) ---
IR/Up = `Right Y+`
IR/Down = `Right Y-`
IR/Left = `Right X-`
IR/Right = `Right X+`
# --- Shake (agitare il Wiimote), mappato su bottoni dedicati ---
Shake/X = `Button 9`
Shake/Y = `Button 12`
Shake/Z = `Button 16`
Extension = Nunchuk
Nunchuk/Buttons/C = `Button 4`
Nunchuk/Buttons/Z = `Button 5`
Nunchuk/Stick/Up = `Left Y+`
Nunchuk/Stick/Down = `Left Y-`
Nunchuk/Stick/Left = `Left X-`
Nunchuk/Stick/Right = `Left X+`
Nunchuk/Stick/Calibration = 100.00 141.42 100.00 141.42 100.00 141.42 100.00 141.42
# --- D-Pad ruotato 90 gradi (Wiimote impugnato di lato) ---
D-Pad/Up = `Pad W`
D-Pad/Down = `Pad E`
D-Pad/Left = `Pad S`
D-Pad/Right = `Pad N`
Source = 1
[Wiimote2]
Source = 2
[Wiimote3]
Source = 2
[Wiimote4]
Source = 2
[BalanceBoard]
Source = 2
