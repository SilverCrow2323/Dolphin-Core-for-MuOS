[GQSEAF.Advanced_Encounter_Modifier_fixed]
# https://wiird.gamehacking.org/forum/index.php/topic,8455.msg73721.html#msg73721
# 
# Values:
# https://wiird.gamehacking.org/forum/index.php/topic,8455.msg73662.html#msg73662
# 
# 042CB558 00000000
# 02AA7C24 0000XXYY
# 06AA7C28 00000010
# 00GG00HH 00II00JJ
# KKLLMMNN OOPPQQRR
# 
# XX - Number of Enemies (Max 8 )
# YY - Number of Species (Max 4)
# 
# GG - Species 1 (00)
# HH - Species 2 (01)
# II - Species 3 (02)
# JJ - Species 4 (03)
# 
# KK - Enemy 1 Species (These determine the different types of enemies using the species you determined with G thru J. Can be 00,01,02 or 03)
# LL - Enemy 2 Species
# MM - Enemy 3 Species
# NN - Enemy 4 Species
# OO - Enemy 5 Species
# PP - Enemy 6 Species
# QQ - Enemy 7 Species
# RR - Enemy 8 Species
Name        = Advanced Encounter Modifier *fixed* [goemon_guy]
Type        = Gecko
