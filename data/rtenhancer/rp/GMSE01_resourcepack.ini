# ============================================================
# Super Mario Sunshine – UHD Texture Pack (qashto)
# Custom Settings for Rt:Core Frontendone
# ============================================================

# Repository: https://github.com/qashto/Super_Mario_Sunshine_UHD_Texture_Pack

[Core]
# Required for DDS BC7 texture pack
Fastmem = True
CPUCore = 0
MMU = True

[Video_Settings]
# Load custom textures
HiresTextures = True

# Cache textures to RAM to prevent stuttering
CacheHiresTextures = True

# Safe texture cache for custom textures
SafeTextureCacheColorSamples = 0

# Enable Scaled EFB Copy (recommended for water effects in SMS)
EFBToTextureEnable = True
EFBCopyScaled = True

# Improve water appearance (qashto's recommendation)
EFBMulMode = 2

# V-Sync to avoid tearing (recommended in the pack's README)
VSync = True

# Disable fog for performance
DisableFog = True

# Enable GPU texture decoding for faster loading
EnableGPUTextureDecoding = True

[Video_Hacks]
# Needed for some games to render correctly with custom textures
EFBAccessEnable = True
BBoxEnable = True

[ActionReplay]
# Remove Heatwave Effect Code NTSC-U
# 0419F83C 4E800020

# 60FPS (NTSC-U) – Optional, from the pack's README
# 044167B8 3F800000
# 042FCB24 60000000
# 04414904 3CA3D70A
# C20066EC 00000002
# C2C28028 EC2105B2
# FEC00890 00000000

# 16:9 Aspect Ratio (Widescreen) [NTSC-U] – Optional
# 04416B74 3F9A7643

[EmuState]
EmulationStateId = 5
EmulationIssues = "UHD Texture Pack: Stable at 60FPS with prefetch enabled"
